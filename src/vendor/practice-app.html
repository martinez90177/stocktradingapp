/* ================= ticket ================= */
const usd=n=>(n<0?'-$':'$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function setTxt(id,t){const e=$(id);if(e)e.innerHTML=t;}
function ticketQty(opt){const n=parseInt(val('qty'));return Math.max(1,isNaN(n)?(opt?1:100):n);}
/**
 * Risk and reward for the plan in the ticket.
 *
 * A stop below the price only makes sense for an upside trade (a call, or a
 * long) and above it only for a downside one, so the stop -- or failing that
 * the target -- says which side the figures are for. The old ticket always
 * priced a call, which quoted a put buyer somebody else's risk.
 */
function planHtml(u,qty,opt){
  const st=parseFloat(val('stop')),tg=parseFloat(val('tgt'));
  const hasS=!isNaN(st),hasT=!isNaN(tg);
  if(!hasS&&!hasT)return '<p class="note">Set a stop and a target on '+S.ticker+'&rsquo;s price to see what the trade risks and what it could make.</p>';
  if(hasS&&hasT&&(st<u)===(tg<u))
    return '<p class="note warn">The stop and the target are both '+(st<u?'below':'above')+' the price, so one of them is on the wrong side.</p>';
  const up=hasS?st<u:tg>u;
  const what=opt?(up?'call':'put'):(up?'long':'short');
  let risk=null,reward=null;
  if(opt){
    const type=up?'call':'put',paid=quote(S.strike,type,S.exDays,u).ask;
    if(hasS)risk=Math.max(0,paid-quote(S.strike,type,S.exDays,st).bid)*100*qty;
    if(hasT)reward=(quote(S.strike,type,S.exDays,tg).bid-paid)*100*qty;
  }else{
    if(hasS)risk=Math.abs(u-st)*qty;
    if(hasT)reward=Math.abs(tg-u)*qty;
  }
  let h='';
  if(risk!=null)h+='<div class="r"><span>Risk if stopped</span><b class="dn">'+usd(-risk)+'</b></div>';
  if(reward!=null)h+='<div class="r"><span>Reward at target</span><b class="'+(reward>=0?'up':'dn')+'">'+(reward>=0?'+':'')+usd(reward)+'</b></div>';
  if(risk&&reward!=null&&reward>0)h+='<div class="r"><span>Reward : risk</span><b>'+(reward/risk).toFixed(1)+' : 1</b></div>';
  h+='<p class="note">For '+(opt?'a '+what+' at the '+S.strike.toFixed(2)+' strike, as if '+S.ticker+' got there now &mdash; time decay makes a later stop cost a little more.':
    'a '+what+' of '+qty+' shares.')+'</p>';
  return h;
}
/**
 * What stops a buy on one side, if anything: the rules enter() applies, stated
 * on the card before the tap instead of in the tape after it. Returns a short
 * reason for the card and a full one for the tape, or null.
 */
function buyBlock(bull){return holdBlock(bull)||ruleBlock(bull,ticketQty(S.mode==='options'));}
function holdBlock(bull){
  if(S.cursor>=MPD)return {s:'Session over',l:'The session is over. Restart or load a new day.'};
  if(S.ended)return {s:'Day ended',l:'You ended this day. Load a new one to keep going.'};
  const p=S.pos;if(!p)return null;
  if(S.mode==='options'){
    const type=bull?'call':'put';
    if(p.kind!=='option')return {s:'Holding shares',l:'Close the share position first.'};
    if(p.optType!==type)return {s:'You hold a '+p.optType,l:'You hold a '+p.optType+'. Close it before buying a '+type+'.'};
    if(p.strike!==S.strike||p.exDays!==S.exDays)return {s:'Other contract open',
      l:'You hold the '+Number(p.strike).toFixed(2)+' '+p.optType+' '+exLabel(p.exDays)+'. Close it, or set the ticket back to that contract to add to it.'};
    return null;
  }
  const dir=bull?'long':'short';
  if(p.kind!=='shares')return {s:'Holding an option',l:'Close the option position first.'};
  if(p.dir!==dir)return {s:'You are '+p.dir,l:'You are '+p.dir+'. Close it before going '+dir+'.'};
  return null;
}
/** The way into a trade: the cards in the ticket, or the L and S keys. */
function buy(bull){
  const why=buyBlock(bull);
  if(why){log(why.l,'y');return;}
  S.oType==='market'?enter(bull):placeOrder(bull);
}
/** The action line on a card: what tapping it will do, at this size and order type. */
function goText(bull,qty){
  const why=buyBlock(bull);if(why)return why.s;
  const opt=S.mode==='options',adding=!!S.pos;
  const what=opt?(qty+' '+(bull?'call':'put')+(qty===1?'':'s')):(qty+(qty===1?' share':' shares'));
  if(S.oType==='limit')return 'Limit order · '+what;
  if(S.oType==='stop')return 'Stop order · '+what;
  return (adding?'Add ':opt||bull?'Buy ':'Short ')+what;
}
/**
 * What the ticket looks like, as opposed to the numbers in it. The ticket is
 * rebuilt only when this changes. It used to be rebuilt on every bar of a
 * replay, which was harmless while the buy buttons lived outside it; with the
 * cards as the buttons, a tap landing mid-rebuild was swallowed, and whatever
 * was being typed in the stop or target box was thrown away.
 */
function ticketKey(){
  const p=S.pos;
  return [S.ticker,S.seed,S.replay?S.replay.date:'',S.mode,S.strike,S.exDays,S.oType,S.cursor>=MPD,RULES.on,S.ended,!!S.or,
    p?[p.kind,p.optType,p.strike,p.exDays,p.dir,p.qty].join(':'):'-',S.orders.length,S.trades.length].join('|');
}
/** A new bar: the same ticket, new numbers. */
function tickTicket(){
  const u=price(),opt=S.mode==='options',inc=cfg(S.ticker).inc;
  setTxt('stkAt',S.ticker+' is at '+u.toFixed(2));
  if(opt){
    const c=quote(S.strike,'call',S.exDays,u),p=quote(S.strike,'put',S.exDays,u);
    const c0=openQuote(S.strike,'call',S.exDays),p0=openQuote(S.strike,'put',S.exDays);
    setTxt('askC',askHtml(c.ask,c0.ask,'ask'));
    setTxt('askP',askHtml(p.ask,p0.ask,'ask'));
    setTxt('lnC','bid <b>'+c.bid.toFixed(2)+'</b> · &Delta; <b>'+c.delta.toFixed(2)+'</b>');
    setTxt('lnP','bid <b>'+p.bid.toFixed(2)+'</b> · &Delta; <b>'+p.delta.toFixed(2)+'</b>');
    setTxt('beC','breakeven <b>'+(S.strike+c.ask).toFixed(2)+'</b>');
    setTxt('beP','breakeven <b>'+(S.strike-p.ask).toFixed(2)+'</b>');
    setTxt('ivl',ivLine(c));
    const sel=$('strikeSel');
    if(sel&&document.activeElement!==sel)[...sel.options].forEach(o=>{const k=parseFloat(o.value);
      o.textContent=k.toFixed(2)+(Math.abs(k-u)<inc/2?' · at the money':'');});
  }else{
    const o0=S.mins[todayStart()].o;
    setTxt('askC',askHtml(u,o0,'last'));
    setTxt('askP',askHtml(u,o0,'last'));
  }
  if(S.pos)setTxt('posBox',posBlock());
  refreshTicket();
}
function ivLine(c){
  return eventNote(S.exDays)+volSource()+' Time decay about <b>'+usd(Math.abs(c.thetaHr)*100)+'</b> an hour per contract.';
}
/** The price line on a card, with how far it has moved since 9:30. */
function askHtml(v,ref,label){

/** Updates the numbers in place, so typing a quantity does not rebuild the ticket under the cursor. */
function refreshTicket(){
  const u=price(),opt=S.mode==='options',qty=ticketQty(opt);
  if(opt){
    const c=quote(S.strike,'call',S.exDays,u),p=quote(S.strike,'put',S.exDays,u);

  // loss limit hit -- so the disabled state follows the reason, not the build.
  [['buyC',true],['buyP',false]].forEach(([id,b])=>{const e=$(id);if(e)e.disabled=!!buyBlock(b);});

    const when=m=>{const d=Math.floor(m/MPD),mm=m-d*MPD;return (d===HISTN?'':dayLbl(d)+' ')+tlbl(mm+1);};
    const what=AF.src==='swing'?(AF.up?'the last swing up':'the last swing down')+(AF.live?', still running':''):AF.src==='day'?'the day\'s range so far':'yesterday\'s range';

    const ext=k.includes('127')||k.includes('161')||k.includes('261')||k.startsWith('-');

    +`<div class="empty" style="margin-top:11px">Range ${S.or.r.toFixed(2)} wide · breakout ${S.brk?'confirmed '+S.brk:'not yet confirmed'}.</div>`;

function paneCoach(){
  const lesson='<div class="lesson">'+(S.cursor>=MPD?dayLesson():'<h5>What the day offered</h5><p>The day&rsquo;s best trade, and the playbook trade with how to execute it, appear here at the 4:00 bell. Not before: knowing where the move went would make the practice worthless.</p>')+'</div>';
  if(!S.trades.length&&!S.pos)
    return '<div class="empty">Take a trade and this grades the execution: entry timing against the breakout, stop logic, strike and expiry choice, theta burn, and how much of the move you captured.</div>'+lesson;
  const out=[],add=(m,t)=>out.push(`<div class="gr"><span class="m ${m}">${m==='ok'?'✓':m==='bad'?'✕':m==='h'?'•':'!'}</span><div class="b">${t}</div></div>`);
  if(!S.trades.length)add('mid','Position still open — close it and the full grade appears here.');
  S.trades.forEach((t,n)=>{
    const inst=t.kind==='option'?`${t.openQty}x ${t.strike} ${t.optType} ${exLabel(t.exDays)}`:`${t.openQty} shares ${t.dir}`;
    add('h',`<b>Trade ${n+1} · ${inst} at ${lbl(HIST,t.entryMin)}</b> — ${sgn(t.total)}${t.R!=null?', '+t.R.toFixed(2)+'R':''}${t.setup?' · '+setupName(t.setup):''}`);
    (t.flags||[]).forEach(f=>{const F=FLAGS[f];if(F)add('bad',`<b>${F[0]}.</b> ${F[1]} <i>${F[3]}</i>`);});
    if(t.flags&&!t.flags.length&&t.rulesOn!==false)add('ok','Every rule kept on this trade. Grade the execution, not the outcome: this is the repeatable part.');
    const bull=t.kind==='option'?t.optType==='call':t.dir==='long';
    // The opening-range notes are about one playbook. A VWAP reclaim or a
    // range fade is not late or early against a breakout it never traded.
    const orb=!t.setup||t.setup==='orb';
    if(!orb){}
    else if(t.entryMin<OR_MIN)add('mid','Entered before 9:45, while the opening range was still forming. There was no range to break yet; that is a different trade from the playbook, and the record should say which.');
    else if(!t.afterBrk)add('bad','You entered before any 5-minute bar closed outside the opening range. That is exactly where fakeouts punish you — the range had not resolved.');
    else if((t.brkDir==='long')!==bull)add('bad','You took the opposite side of the confirmed breakout. Different setup, different playbook.');
    else if(t.lagBars===0)add('ok','Entry on the breakout bar close itself. Textbook timing.');
    else if(t.lagBars<=2)add('ok',`Entered ${t.lagBars} bar(s) after confirmation — slight chase, still fine.`);
    else add('mid',`You waited ${t.lagBars} bars after confirmation. Late entries widen the stop and shrink R on the same target.`);

    if(t.kind==='option'){
      const d=Math.abs(t.entryDelta);
      if(d<.20)add('bad',`You bought a ${d.toFixed(2)}-delta contract. Far out of the money means the underlying has to move a long way just to break even — most of these expire worthless even when your direction is right.`);
      else if(d<.35)add('mid',`${d.toFixed(2)} delta is on the cheap side. It moves fast when you are right, but decays hard when the move stalls.`);
      else add('ok',`${d.toFixed(2)} delta is a reasonable directional strike — enough sensitivity to the move without paying full intrinsic.`);
      const held=(t.closeMin-t.entryMin);
      const thetaCost=Math.abs(t.entryTheta)*100*t.openQty*(held/60);
      if(t.exDays===0&&held>45)
        add('mid',`You held a 0DTE contract for ${held} minutes. Time decay alone cost roughly ${money(thetaCost)} over that stretch, regardless of direction. On 0DTE the clock is a second opponent.`);
      const spread=(t.entryPrem-quote(t.strike,t.optType,t.exDays,t.uEntry).bid)*100*t.openQty;
      add(spread>Math.abs(t.total)*.35?'mid':'ok',
        `Spread cost on entry was about ${money(spread)} — you paid the ask and would sell the bid. ${spread>Math.abs(t.total)*.35?'That is a large share of this trade\'s result; wider spreads demand bigger moves to be worth taking.':'Reasonable relative to the trade size.'}`);
    }
    if(t.stopU==null)add('bad','No stop on the underlying. Without one there is no R to measure, and with options a stalled move bleeds premium while you wait.');
    else if(!orb||!S.or)add('ok',`Stop at ${t.stopU.toFixed(2)} before entry${t.rr0?`, planned reward ${t.rr0.toFixed(1)}x the risk`:''}. The plan had its parts.`);
    else{
      const inR=t.stopU<=S.or.hi&&t.stopU>=S.or.lo;
      add(inR?'ok':'mid',inR
        ?'Stop sat inside the opening range — a move back inside invalidates the breakout, so that is logical placement.'
        :'Stop was outside the range entirely. Anchoring to the 50% or the far edge gives tighter, more defensible risk.');
    }
    const ext=t.exits.some(e=>e.why.includes('127')||e.why.includes('161'));
    if(ext)add('ok','You scaled out at the fib extensions — exactly what those levels are for.');
    else if(orb&&t.exits.length===1&&t.exits[0].why!=='stop'&&t.exits[0].why!=='expiry')
      add('mid','One all-or-nothing exit. Trimming at 127.2% and running the rest at 161.8% smooths results on days that keep extending.');
    if(t.exits.some(e=>e.why==='expiry'))
      add('bad','You held a 0DTE contract into expiration. Whatever extrinsic value was left went to zero — closing before the last stretch is almost always better.');
    if(t.total>0&&t.mfe>0){
      const cap=t.kind==='option'?null:t.total/(t.mfe*t.openQty)*100;
      if(cap!=null&&cap<40)add('mid',`You captured about ${Math.round(cap)}% of the available move. Right read, loose exit.`);
      else if(cap!=null&&cap>75)add('ok',`You captured roughly ${Math.round(cap)}% of the max favorable move — strong exit management.`);
    }
    if(t.total<0&&t.exits.some(e=>e.why==='stop'))add('ok','You let the stop do its job instead of widening it. Losing trade, correct behavior.');
  });
  const names={trendup:'trending up',trenddown:'trending down',chop:'choppy and range-bound',fakeout:'a fakeout that reversed'};
  if(names[S.reg])add('h',`Today was generated as <b>${names[S.reg]}</b>. Long options do very different things across those four — trend days pay, chop days bleed theta.`);
  else add('h',dayDesc());
  add('h',disciplineLine());
  return out.join('')+lesson;

  $('jgo')&&($('jgo').onclick=()=>{

      log('Give the time as H:MM, for example 10:15.','y');return;}
    if(hh<9||(hh===9&&mm<30))hh+=12;                 // 1:30 means the afternoon
    const target=Math.round(hh*60+mm-(9*60+30));

    if(target>MPD){log('The session ends at 4:00.','y');return;}

/* ================= your account, your rules ================= */
/*
 * The simulator trades the account you actually have, under the rules you
 * wrote for it (rules.json, "Alex's Rules"), and refuses what they refuse:
 * the daily cap on premium bought, the loss that ends the day, the trade
 * count, the most a stop may risk, no entry without a stop and a named setup,
 * no adding to a loser, no widening a stop, ten minutes off after two
 * straight losses. Every refusal names its rule, on the card. With the rules
 * switched off nothing is refused and every breach is recorded against the
 * trade instead, so the record still says what happened.
 *
 * All of it lives in this browser: the rules under mpRules, and under
 * mpLedger every committed practice trade and session. The balance is the
 * starting balance plus that record, net of fees. Trades reach the record at
 * the bell, when the day is ended by hand, or on the way out to another
 * session -- never the moment they close, because a rewind must be able to
 * unmake a trade and a record cannot be unmade.
 */
const RULE_DEF={on:1,start:1000,cap:200,maxLoss:60,maxTrades:3,maxRisk:60,minRR:1.5,fee:.65,
  needStop:1,needSetup:1,lockLoss:1,cooldown:10,noLate0:1,cash:1,rewind:1,blind:1,v:2};
function loadJSON(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v&&typeof v==='object'?v:d;}catch(e){return d;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
const SAVED_RULES=loadJSON('mpRules',{});
let RULES=Object.assign({},RULE_DEF,SAVED_RULES);
function saveRules(){saveJSON('mpRules',RULES);}
let LEDGER=loadJSON('mpLedger',{});
if(!Array.isArray(LEDGER.trades))LEDGER.trades=[];
if(!Array.isArray(LEDGER.sessions))LEDGER.sessions=[];
// The default starting balance was $500 when the record began; it is $1,000
// now. A browser that already has a record and never wrote its own starting
// balance keeps the $500 its balance was built on, written down so it stays.
if(SAVED_RULES.start==null&&(LEDGER.trades.length||LEDGER.sessions.length)){RULES.start=500;saveRules();}
// Blind days became the default after rules had already been saved with the
// old default written into them. Switched on once for everyone; the Rules tab
// still turns it off.
if(SAVED_RULES.v!==2){RULES.blind=1;RULES.v=2;saveRules();}
function saveLedger(){saveJSON('mpLedger',LEDGER);}
function localDay(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const RULEBOOK=window.MP_RULEBOOK||null;

const SETUPS=[['orb','Opening range breakout'],['orbf','Opening range failure'],['vwapr','VWAP reclaim'],['vwapj','VWAP rejection'],
  ['pull','Pullback to an EMA'],['cont','Trend continuation'],['range','Range fade'],['rev','Reversal'],['retest','Breakout retest'],['other','Other']];
function setupName(id){const s=SETUPS.find(x=>x[0]===id);return s?s[1]:'No setup named';}

/* What a breach is called, what it means, what it costs the score, and the rule it breaks. */
const FLAGS={
  noStop:['No stop','Entered without a stop on the price.',25,'Entry, stop and target: say all three before you click.'],
  noSetup:['No setup named','Clicked without saying what the trade was.',25,'No setup, no trade. Boredom is not a signal.'],
  movedStop:['Moved the stop away','Widened the stop while the trade was open.',25,'Closer is fine, further is never fine.'],
  revenge:['Revenge entry','Back in within three minutes of a loss.',10,'The market does not know you lost, and will not give it back because you asked louder.'],
  cooldown:['Skipped the cool-off','Traded inside the ten minutes after two straight losses.',25,'Two losses in a row: stand up and walk away for ten minutes.'],
  afterLimit:['Past the daily loss limit','Kept trading after the day was lost.',25,'When you hit it, you are done.'],
  overTrades:['Over the trade count','More trades than the day allows.',25,'Most days have two or three real setups. Everything else is the market taking commissions.'],
  overCap:['Over the daily cap','More premium bought than the day allows.',25,'Size from the stop distance, never from how confident you feel.'],
  oversized:['Oversized','Risked more to the stop than one trade may.',25,'The stop is the only thing that decides what a loss costs.'],
  addedLoser:['Added to a loser','Averaged down into a losing position.',25,'Never add to a loser to improve the average.'],
  late0:['Late 0DTE','A new 0DTE entry after 3:30.',10,'After 3:30 a 0DTE is time value about to vanish.'],
  lowRR:['Thin reward','The planned reward was under the minimum multiple of the risk.',10,'A target that never paid for the stop is an exit you did not plan.'],
  expiry:['Held into expiry','A 0DTE left to expire instead of being closed.',10,'You are not paid for holding.'],
  giveback:['Gave back a green day','Up more than half the loss limit, then closed the day down.',15,'Protect a green day. After a good gain, cut size or stop.']
};
const JMAP={noStop:'no-plan',noSetup:'no-plan',movedStop:'moved-stop',revenge:'revenge',cooldown:'against-plan',afterLimit:'against-plan',
  overTrades:'overtraded',overCap:'against-plan',oversized:'oversized',addedLoser:'against-plan',late0:'against-plan',expiry:'held-loser'};
function journalMistakes(flags){return [...new Set(flags.map(f=>JMAP[f]).filter(Boolean))];}
function scoreOf(flags){return Math.max(0,100-flags.reduce((a,f)=>a+(FLAGS[f]?FLAGS[f][2]:0),0));}

/** What this session has used so far. `total` on a closed trade is net of fees. */
function dayUse(){
  const all=S.trades.concat(S.pos?[S.pos]:[]);
  let outlay=0;
  all.forEach(p=>{if(p.kind==='option')outlay+=p.avgPrem*100*(p.openQty||p.qty);});
  return {outlay,realized:S.trades.reduce((a,t)=>a+t.total,0),count:S.trades.length+(S.pos?1:0),
    uncommitted:S.trades.filter(t=>!t.sent).reduce((a,t)=>a+t.total,0)};
}
/**
 * The balance the record says you have. The account can be set to any amount
 * at any time without losing the record: a rebase marks the moment, and only
 * trades after it count from then on. `baseline` is what "since" measures from.
 */
function baseline(){return LEDGER.rebase?LEDGER.rebase.amount:RULES.start;}
function balance(){
  const rb=LEDGER.rebase;
  return baseline()+LEDGER.trades.filter(t=>!rb||(t.at||'')>rb.at).reduce((a,t)=>a+(t.net||0),0);
}
/** Sets the account to `amount` from now on, keeping every trade in the record. */
function setBalance(amount,why){
  if(!(amount>=0))return;
  commitSession(false);   // trades already closed this session belong to the old balance
  LEDGER.rebase={amount:+amount.toFixed(2),at:new Date().toISOString()};
  saveLedger();
  log('Account set to '+usd(amount)+(why?' ('+why+')':'')+'. The record is kept; the balance counts from here.','hl');
  renderAll();
}
/** The balance right now: the record, plus what this session has closed but not yet written to it. */
function acctLive(){return balance()+dayUse().uncommitted;}
function openPnl(){
  const p=S.pos;if(!p)return 0;const u=price();
  if(p.kind==='shares')return (p.dir==='long'?u-p.avg:p.avg-u)*p.qty;
  return (quote(p.strike,p.optType,p.exDays,u).bid-p.avgPrem)*100*p.qty;
}
/** Minutes still to wait after two losses in a row, or 0. */
function cooldownLeft(){
  if(!RULES.cooldown||S.trades.length<2)return 0;
  const a=S.trades[S.trades.length-1],b=S.trades[S.trades.length-2];
  if(a.total>=0||b.total>=0)return 0;
  return Math.max(0,Math.ceil(a.closeMin+RULES.cooldown-S.cursor));
}
/** Dollars at risk to the stop `st` for what the ticket describes, or null without one. */
function riskAt(bull,qty,st,u){
  if(st==null||isNaN(st))return null;
  if(S.mode==='shares')return Math.abs(u-st)*qty;
  const type=bull?'call':'put',paid=quote(S.strike,type,S.exDays,u).ask;
  return Math.max(0,paid-quote(S.strike,type,S.exDays,st).bid)*100*qty;
}
function rewardAt(bull,qty,tg,u){
  if(tg==null||isNaN(tg))return null;
  if(S.mode==='shares')return Math.abs(tg-u)*qty;
  const type=bull?'call':'put',paid=quote(S.strike,type,S.exDays,u).ask;
  return (quote(S.strike,type,S.exDays,tg).bid-paid)*100*qty;
}
/**
 * Why the rules refuse this buy, or null: a short form for the card and a
 * long one for the tape, each naming the rule. Checked before every tap and
 * again on every bar, so a cool-off that ends re-enables the card by itself.
 */
function ruleBlock(bull,qty){
  if(!RULES.on)return null;
  const u=price(),opt=S.mode==='options',use=dayUse(),adding=!!S.pos;
  if(RULES.lockLoss&&use.realized<=-RULES.maxLoss)
    return {s:'Daily loss limit hit',l:'Down '+usd(-use.realized)+' today, past your '+usd(RULES.maxLoss)+' limit. You are done for the day: review it, do not revenge it.'};
  if(!adding&&use.count>=RULES.maxTrades)
    return {s:'Trade limit reached',l:'That would be trade '+(use.count+1)+' on a '+RULES.maxTrades+'-trade day. The next setup is not a make-up trade.'};
  const cd=cooldownLeft();
  if(!adding&&cd>0)return {s:'Cooling off · '+cd+' min',l:'Two losses in a row. Your rule is ten minutes away from the screen; '+cd+' to go.'};
  if(adding&&openPnl()<0)
    return {s:'Never add to a loser',l:'This position is losing '+usd(-openPnl())+'. Adding raises the risk exactly when the trade is saying the read was wrong.'};
  const st=parseFloat(val('stop'));
  if(!adding&&RULES.needSetup&&!S.setup)return {s:'Name the setup first',l:'No setup, no trade. Say what this is in the plan above the cards.'};
  if(!adding&&RULES.needStop&&isNaN(st))return {s:'Set a stop first',l:'Entry, stop and target before you click. Put the stop on '+S.ticker+'\'s price in the plan.'};
  if(opt){
    if(RULES.noLate0&&S.exDays===0&&!adding&&S.cursor>360)
      return {s:'Too late for a 0DTE',l:'After 3:30 a 0DTE contract is time value about to vanish. No new 0DTE entries this late; 1DTE is the same trade with a tomorrow.'};
    const ask=quote(S.strike,bull?'call':'put',S.exDays,u).ask,each=ask*100+RULES.fee,cost=each*qty;
    if(use.outlay+cost>RULES.cap+1e-9){
      const fit=Math.floor(Math.max(0,RULES.cap-use.outlay)/each+1e-9);
      return {s:fit>0?'Over the daily cap · '+fit+' fits':'Daily cap used up',
        l:usd(cost)+' would take today past your '+usd(RULES.cap)+' of options ('+usd(use.outlay)+' bought so far). '+(fit>0?'Size '+fit+' still fits.':'Nothing more fits today.')};
    }
  }else{
    if(RULES.cash&&!bull&&!adding)return {s:'No shorting in a cash account',l:'A cash account cannot short shares. If you want the downside, buy a put.'};
    if(RULES.cash&&u*qty>acctLive()+1e-9)return {s:'Not enough cash',l:usd(u*qty)+' of shares against '+usd(acctLive())+' in the account. A cash account has no margin.'};
  }
  const risk=adding?null:riskAt(bull,qty,st,u);
  if(risk!=null&&risk>RULES.maxRisk+1e-9)
    return {s:'Risks '+usd(risk)+' · max '+usd(RULES.maxRisk),l:'To that stop this trade risks '+usd(risk)+', past your '+usd(RULES.maxRisk)+' a trade. Move the stop closer, cut size, or take a cheaper strike. Size from the stop, never from confidence.'};
  return null;
}
/** What the rules only warn about. Shown under the cards, recorded against the trade, never refused. */
function ruleWarn(bull,qty){
  const u=price(),st=parseFloat(val('stop')),tg=parseFloat(val('tgt')),out=[];
  if(S.pos)return out;   // these are about the next entry, and there is a trade on
  const risk=riskAt(bull,qty,st,u),rew=rewardAt(bull,qty,tg,u);
  if(risk>0&&rew!=null&&rew>0&&rew/risk<RULES.minRR)out.push('Reward '+(rew/risk).toFixed(1)+'x the risk, under your '+RULES.minRR+'x.');
  const last=S.trades[S.trades.length-1];
  if(!S.pos&&last&&last.total<0&&S.cursor-last.closeMin<=3)out.push('Three minutes since a loss. Is this the setup, or the loss talking?');
  const use=dayUse();
  if(!S.pos&&use.realized>=RULES.maxLoss/2)out.push('Up '+usd(use.realized)+' today. Protect a green day: cut size, or stop.');
  return out;
}
/** What the plan carried at entry, kept on the position and later on the record. */
function planOf(bull,qty,stopU,tgtU,u){
  const st=isNaN(stopU)?null:stopU,tg=isNaN(tgtU)?null:tgtU;
  const risk=riskAt(bull,qty,st,u),rew=rewardAt(bull,qty,tg,u);
  return {setup:S.setup||null,flags:entryFlags(bull,qty,st,risk,rew,false),stopU0:st,risk0:risk,
    rr0:risk>0&&rew!=null?rew/risk:null,rulesOn:!!RULES.on,rewinds:S.rewinds||0,fees:0,stopMoved:false,adds:0};
}
/** The breaches an entry -- or an add -- commits, whether or not the rules were on to refuse them. */
function entryFlags(bull,qty,st,risk,rew,adding){
  const f=[],use=dayUse(),opt=S.mode==='options',last=S.trades[S.trades.length-1];
  if(use.realized<=-RULES.maxLoss)f.push('afterLimit');
  if(adding){
    if(openPnl()<0)f.push('addedLoser');
  }else{
    if(st==null)f.push('noStop');
    if(!S.setup)f.push('noSetup');
    if(use.count>=RULES.maxTrades)f.push('overTrades');
    if(cooldownLeft()>0)f.push('cooldown');
    else if(last&&last.total<0&&S.cursor-last.closeMin<=3)f.push('revenge');
    if(opt&&S.exDays===0&&S.cursor>360)f.push('late0');
    if(risk!=null&&risk>RULES.maxRisk+1e-9)f.push('oversized');
    if(risk>0&&rew!=null&&rew>0&&rew/risk<RULES.minRR)f.push('lowRR');
  }
  if(opt){const ask=quote(S.strike,bull?'call':'put',S.exDays,price()).ask;
    if(use.outlay+(ask*100+RULES.fee)*qty>RULES.cap+1e-9)f.push('overCap');}
  return f;
}
/** An add to an open position: its own breaches join the position's. Called before the add changes it. */
function noteAdd(p,bull,qty){
  p.adds=(p.adds||0)+1;
  entryFlags(bull,qty,p.stopU,null,null,true).forEach(f=>{if(!(p.flags||(p.flags=[])).includes(f))p.flags.push(f);});
}
/**
 * A stop on an open position may move closer, never further. With the rules
 * on a wider stop is refused and the box put back; off, it goes through and
 * is recorded as moving the stop away.
 */
function setStop(v){
  const p=S.pos;if(!p)return;
  const bull=p.kind==='shares'?p.dir==='long':p.optType==='call';
  const dist=x=>bull?p.uEntry-x:x-p.uEntry;   // below the entry for a long, above it for a short; more is wider
  if(p.stopU!=null&&(v==null||dist(v)>dist(p.stopU)+1e-9)){
    if(RULES.on){
      log('Never move a stop away from price. Closer is fine, further is never fine. Kept at '+p.stopU.toFixed(2)+'.','y');
      if($('stop'))$('stop').value=p.stopU.toFixed(2);return;
    }
    p.stopMoved=true;
    log('Stop moved from '+p.stopU.toFixed(2)+' to '+(v==null?'none':v.toFixed(2))+', away from the price. Recorded against this trade.','y');
  }else if(p.stopU!=null&&v!=null&&dist(v)<dist(p.stopU)-1e-9)log('Stop tightened to '+v.toFixed(2)+'.','hl');
  p.stopU=v;
}
/** The record of one closed round trip. Settles the flags on the position too, so the journal copy matches. */
function tradeRecord(p,cm,risk){
  const flags=(p.flags||[]).slice();
  if(p.stopMoved&&!flags.includes('movedStop'))flags.push('movedStop');
  if(p.exits.some(e=>e.why==='expiry')&&!flags.includes('expiry'))flags.push('expiry');
  p.flags=flags;
  const opt=p.kind==='option';
  return {id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),sid:S.sid,sym:S.ticker,
    date:S.replay?S.replay.date:null,at:new Date().toISOString(),day:S.day,
    entryMin:p.entryMin,closeMin:cm,kind:p.kind,side:opt?p.optType:p.dir,strike:opt?p.strike:null,exDays:opt?p.exDays:null,
    qty:p.openQty||1,entry:+(opt?p.avgPrem:p.avg).toFixed(2),exit:+(p.exitNotional/p.closedQty).toFixed(2),
    gross:+(p.realized+(p.fees||0)).toFixed(2),fees:+(p.fees||0).toFixed(2),net:+p.realized.toFixed(2),
    risk:risk==null?null:+risk.toFixed(2),R:risk?+(p.realized/risk).toFixed(3):null,rr0:p.rr0==null?null:+p.rr0.toFixed(2),
    setup:p.setup||null,delta:opt?+p.entryDelta.toFixed(2):null,held:cm-p.entryMin,
    mfe:+p.mfe.toFixed(2),mae:+p.mae.toFixed(2),outlay:opt?+(p.avgPrem*100*(p.openQty||1)).toFixed(2):0,
    adds:p.adds||0,exits:p.exits.length,how:p.exits.map(e=>e.why).join('+'),
    flags,score:scoreOf(flags),rulesOn:p.rulesOn!==false,rewinds:p.rewinds||0,repeat:!!S.repeat,blind:!!S.blind};
}
function sessionScore(ts,giveback){
  const base=ts.length?ts.reduce((a,t)=>a+t.score,0)/ts.length:100;
  return Math.max(0,Math.round(base-(giveback?FLAGS.giveback[2]:0)));
}
/**
 * Writes this session into the record: the trades waiting since the last
 * commit, and the session's own line. A day with no trades is still recorded
 * when it ends -- the skips are evidence of discipline.
 */
function commitSession(ended){
  const pend=S.pendingLedger.splice(0);
  pend.forEach(r=>{if(!LEDGER.trades.some(t=>t.id===r.id))LEDGER.trades.push(r);});
  S.trades.forEach(t=>{t.sent=true;});
  const mine=LEDGER.trades.filter(t=>t.sid===S.sid);
  if(!mine.length&&!ended)return;
  let rec=LEDGER.sessions.find(x=>x.sid===S.sid);
  if(!rec){rec={sid:S.sid,sym:S.ticker,date:S.replay?S.replay.date:null,startedAt:S.startedAt,day:S.day};LEDGER.sessions.push(rec);}
  const net=mine.reduce((a,t)=>a+t.net,0);
  const giveback=!!ended&&(S.peakNet||0)>=RULES.maxLoss/2&&net<0;
  Object.assign(rec,{trades:mine.length,net:+net.toFixed(2),fees:+mine.reduce((a,t)=>a+t.fees,0).toFixed(2),
    wins:mine.filter(t=>t.net>0).length,score:sessionScore(mine,giveback),peak:+(S.peakNet||0).toFixed(2),
    breaches:mine.reduce((a,t)=>a+t.flags.length,0)+(giveback?1:0),giveback,
    rewinds:S.rewinds||0,rulesOn:!!RULES.on,blind:!!(RULES.blind&&S.replay),ended:!!ended||!!rec.ended,
    endedAt:ended?new Date().toISOString():rec.endedAt||null,minute:S.cursor});
  saveLedger();
  if(pend.length)log(pend.length+' trade'+(pend.length===1?'':'s')+' written to the record. Account '+usd(acctLive())+'.','hl');
}
/** The 4:00 bell, or the day ended by hand: commit, reveal a blind day, debrief. */
function bell(){
  if(S.pendingJournal.length)flushJournal('close');
  commitSession(true);
  S.ended=true;
  if(S.blind)reveal();
  if(!S.belled){S.belled=true;debrief();}
  renderAll();
}
function reveal(){
  const d=S.replay&&S.replay.date;S.blind=false;S.cache={};
  renderSessRow();const e=$('sess');if(e&&d)e.textContent=d;
  if(d)log('Blind day revealed: it was '+dayName(d)+', '+d+'.','hl');
}

      ?'<span class="'+(use.outlay>=RULES.cap-1e-9?'bad':'')+'">'+(tight?d0(use.outlay)+'/'+d0(RULES.cap):usd(use.outlay)+' / '+usd(RULES.cap)+' bought')+'</span>'+
       '<span class="'+(use.count>=RULES.maxTrades?'warn':'')+'">'+use.count+(tight?'/':' / ')+RULES.maxTrades+(tight?'':' trades')+'</span>'+
       '<span class="'+lossCls+'">'+(tight?'lim −'+d0(RULES.maxLoss):'limit '+usd(-RULES.maxLoss))+'</span>'+

/** The line under the cards: what the rules allow right now, in numbers. */
function rulesLine(qty){
  if(!RULES.on)return '<span class="bad">Rules are off.</span> Nothing is refused; every breach is recorded against the trade. The Rules tab turns them on.';
  const use=dayUse(),opt=S.mode==='options',u=price();
  const st=parseFloat(val('stop')),tg=parseFloat(val('tgt'));
  const bull=!isNaN(st)?st<u:!isNaN(tg)?tg>u:true;
  let h='Your rules: <b>'+usd(Math.max(0,RULES.cap-use.outlay))+'</b> of '+usd(RULES.cap)+' left to buy today · trade <b>'+Math.min(use.count+(S.pos?0:1),RULES.maxTrades)+'</b> of '+RULES.maxTrades+
    ' · day '+sgn(use.realized)+' against a '+usd(-RULES.maxLoss)+' limit · up to <b>'+usd(RULES.maxRisk)+'</b> at risk a trade';
  if(opt){
    const c=quote(S.strike,'call',S.exDays,u).ask,p=quote(S.strike,'put',S.exDays,u).ask,left=Math.max(0,RULES.cap-use.outlay);
    const fc=Math.floor(left/(c*100+RULES.fee)+1e-9),fp=Math.floor(left/(p*100+RULES.fee)+1e-9);
    h+=' · <b>'+fc+'</b> call'+(fc===1?'':'s')+' or <b>'+fp+'</b> put'+(fp===1?'':'s')+' fit here · fees '+usd(RULES.fee)+' a contract each way';
  }
  const warns=ruleWarn(bull,qty);
  if(warns.length)h+='<br><span class="bad">'+warns.join(' ')+'</span>';
  return h;
}
/** The recorded day in a sentence, for the coach: nobody labelled it in advance. */
function dayDesc(){
  const s=todayStart(),bars=S.mins.slice(s,revealed());if(!bars.length)return '';
  let h=-Infinity,l=Infinity;for(const b of bars){if(b.h>h)h=b.h;if(b.l<l)l=b.l;}
  const o=bars[0].o,c=bars[bars.length-1].c,over=S.cursor>=MPD;
  const where=!S.or?'before the opening range has formed':c>S.or.hi?'above the opening range':c<S.or.lo?'below the opening range':'back inside the opening range';
  return S.ticker+' opened at '+o.toFixed(2)+', has a high of '+h.toFixed(2)+' and a low of '+l.toFixed(2)+(over?'':' so far')+', and '+(over?'closed':'is')+' at '+c.toFixed(2)+
    ' ('+(c>=o?'+':'−')+Math.abs((c/o-1)*100).toFixed(2)+'%), '+where+'. A real day: nobody labelled it trend or chop in advance, which is the point.';
}
function disciplineLine(){
  const ts=S.trades,n=ts.length;if(!n)return 'No trades closed yet today. If there was no setup, that is a good day.';
  const br=ts.reduce((a,t)=>a+(t.flags||[]).length,0),sc=Math.round(ts.reduce((a,t)=>a+(t.score==null?100:t.score),0)/n);
  return 'Discipline today: <b>'+sc+'/100</b> across '+n+' trade'+(n===1?'':'s')+(br?', '+br+' rule'+(br===1?'':'s')+' broken':', every rule kept')+'. Grade the execution, not the outcome.';
}

/* ---- what the day offered ---- */
/*
 * Shown at the bell, never before: the day's biggest move priced as the
 * at-the-money 0DTE contract -- hindsight, nobody buys the low -- and the
 * playbook trade a rule-following trader could actually have taken: the
 * first 5-minute close out of the opening range, with the strike, the price
 * paid, the stop, the targets, when each was hit, and the result. Then what
 * you did beside it. A day with no breakout says so: sitting out was the
 * trade.
 */
function optionAt(bull,i,under,atMin){
  const inc=cfg(S.ticker).inc,type=bull?'call':'put';
  let K=Math.round(under/inc)*inc,q=quote(K,type,0,under,atMin),fit=q.ask*100+RULES.fee<=RULES.cap;
  let alt=null;
  if(!fit&&RULES.on){   // the first strike further out that the cap allows
    for(let k=1;k<=6&&!alt;k++){const K2=+(K+(bull?1:-1)*k*inc).toFixed(2),q2=quote(K2,type,0,under,atMin);
      if(q2.ask*100+RULES.fee<=RULES.cap)alt={K:K2,q:q2};}
  }
  return {K,type,q,fit,alt};
}
function pnlOf(o,under,atMin){const q=quote(o.K,o.type,0,under,atMin);return {sold:q.bid,pnl:(q.bid-o.q.ask)*100-RULES.fee*2,pct:(q.bid/o.q.ask-1)*100};}
function bestMove(){
  const s=todayStart(),bars=S.mins.slice(s,s+MPD);if(bars.length<MPD)return null;
  let lo={c:Infinity,m:0},hi={c:-Infinity,m:0},L={d:0},Sh={d:0};
  for(let m=OR_MIN;m<=385;m++){const c=bars[m].c;
    if(c-lo.c>L.d)L={d:c-lo.c,i:lo.m,j:m};
    if(hi.c-c>Sh.d)Sh={d:hi.c-c,i:hi.m,j:m};
    if(c<lo.c)lo={c,m};if(c>hi.c)hi={c,m};}
  return {long:L,short:Sh};
}
function playbookTrade(){
  const s=todayStart(),bars=S.mins.slice(s,s+MPD);if(bars.length<MPD||!S.or)return null;
  let brk=null;
  for(let m=OR_MIN+5;m<=MPD;m+=5){const c=bars[m-1].c;if(c>S.or.hi){brk={bull:true,m};break;}if(c<S.or.lo){brk={bull:false,m};break;}}
  if(!brk)return {none:true};
  const bull=brk.bull,i=brk.m-1,u0=bars[i].c,stop=bull?S.or.lo:S.or.hi;
  const t1=bull?S.fib['127.2%']:S.fib['-27.2%'],t2=bull?S.fib['161.8%']:S.fib['-61.8%'];
  // A breakout bar that closed past the first target already is a chase: the
  // level had a price and this is above it. The second target is the trade
  // then, and past that there is no trade.
  const past1=bull?u0>=t1:u0<=t1,past2=bull?u0>=t2:u0<=t2;
  let hit1=past1?i:null,hit2=null,stopped=null;
  for(let m=i+1;m<=384;m++){const b=bars[m];
    if(bull?b.l<=stop:b.h>=stop){stopped=m;break;}
    if(hit1==null&&(bull?b.h>=t1:b.l<=t1))hit1=m;
    if(hit1!=null&&(bull?b.h>=t2:b.l<=t2)){hit2=m;break;}}
  return {bull,i,u0,stop,t1,t2,hit1,hit2,stopped,lateBrk:brk.m>150,chased:past1,extended:past2};
}
const pc=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(0)+'%';
const mins=n=>n+' minute'+(n===1?'':'s');
function dayLesson(){
  const bm=bestMove(),pb=playbookTrade();if(!bm||!pb)return '';
  const s=todayStart(),bars=S.mins.slice(s,s+MPD),T=m=>tlbl(m+1),P=v=>v.toFixed(2);
  const out=[];
  // the playbook trade
  out.push('<h5>The playbook trade &middot; no hindsight</h5>');
  if(pb.none)out.push('<p>No 5-minute bar closed outside the opening range ('+P(S.or.lo)+' to '+P(S.or.hi)+') all day. For the breakout playbook that is a <b>no-trade day</b>, and sitting out was the trade. If you traded, it was something else &mdash; and the record should say what.</p>');
  else{
    const o=optionAt(pb.bull,pb.i,pb.u0,pb.i+1),side=pb.bull?'above':'below',name=pb.bull?'call':'put';
    const risk=Math.max(0,o.q.ask-quote(o.K,o.type,0,pb.stop,pb.i+1).bid)*100;
    const steps=['<b>'+T(pb.i)+'</b> &mdash; the first 5-minute close '+side+' the opening range: '+P(pb.u0)+' against the range '+(pb.bull?'high '+P(S.or.hi):'low '+P(S.or.lo))+'.'+(pb.lateBrk?' Late: the range held until after noon, which is a weaker breakout.':''),
      'Buy the <b>'+P(o.K)+' '+name+', 0DTE</b>, at <b>'+usd(o.q.ask)+'</b> ('+usd(o.q.ask*100)+' a contract'+(o.fit?', within your cap':', over your '+usd(RULES.cap)+' cap'+(o.alt?' &mdash; the '+P(o.alt.K)+' '+name+' at '+usd(o.alt.q.ask)+' fits':''))+').',
      'Stop on '+S.ticker+' at the far side of the range, <b>'+P(pb.stop)+'</b>: about <b>'+usd(risk)+'</b> at risk on the premium'+(risk>RULES.maxRisk?', over your '+usd(RULES.maxRisk)+' &mdash; the mid-range stop or a smaller contract brings it inside':'')+'.',
      'First target the 127% extension, <b>'+P(pb.t1)+'</b>; second the 162%, <b>'+P(pb.t2)+'</b>.'];
    let result;
    if(pb.extended)result='The breakout bar closed past <b>both</b> targets already ('+P(pb.u0)+'). That is not an entry, it is someone else&rsquo;s exit: by the rule on chasing, this one is a pass, or a wait for the pullback.';
    else if(pb.chased){
      result='The breakout bar closed past the first target already ('+P(pb.u0)+' against '+P(pb.t1)+'), so the first target is gone and the second is the trade &mdash; a worse trade, with the same stop and less reward. ';
      if(pb.hit2!=null){const r2=pnlOf(o,pb.t2,pb.hit2+1);result+='<b>'+T(pb.hit2)+'</b> &mdash; second target hit. The '+name+' was '+usd(r2.sold)+': <b class="'+(r2.pnl>=0?'up':'dn')+'">'+sgn(r2.pnl)+'</b> after fees ('+pc(r2.pct)+').';}
      else if(pb.stopped!=null){const r=pnlOf(o,pb.stop,pb.stopped+1);result+='<b>'+T(pb.stopped)+'</b> &mdash; stopped before it got there: <b class="dn">'+sgn(r.pnl)+'</b> after fees. The chase cost exactly what the rule says it costs.';}
      else{const r=pnlOf(o,bars[384].c,385);result+='It never reached the second target; closed at 3:55 for <b class="'+(r.pnl>=0?'up':'dn')+'">'+sgn(r.pnl)+'</b>.';}
    }
    else if(pb.stopped!=null&&pb.hit1==null){const r=pnlOf(o,pb.stop,pb.stopped+1);
      result='<b>'+T(pb.stopped)+'</b> &mdash; stopped: '+S.ticker+' came back through '+P(pb.stop)+' before either target. The '+name+' sold at '+usd(r.sold)+': <b class="dn">'+sgn(r.pnl)+'</b> after fees ('+pc(r.pct)+'). A losing trade, correctly taken; the stop did its job.';}
    else if(pb.hit1!=null){const r1=pnlOf(o,pb.t1,pb.hit1+1);
      result='<b>'+T(pb.hit1)+'</b> &mdash; first target hit, '+mins(pb.hit1-pb.i)+' in. The '+name+' was '+usd(r1.sold)+': <b class="'+(r1.pnl>=0?'up':'dn')+'">'+sgn(r1.pnl)+'</b> on one contract after fees ('+pc(r1.pct)+').';
      if(pb.hit2!=null){const r2=pnlOf(o,pb.t2,pb.hit2+1);result+=' <b>'+T(pb.hit2)+'</b> &mdash; second target hit too, '+usd(r2.sold)+' (<b class="'+(r2.pnl>=0?'up':'dn')+'">'+sgn(r2.pnl)+'</b>). With one contract, take the first target; with three, a third at each and let the rest run to the stop.';}
      else if(pb.stopped!=null)result+=' It never reached the second target and was back through the stop by '+T(pb.stopped)+', so anything still held after the first target gave it back.';
      else result+=' The second target was never reached; the rest would have run to the close.';}
    else{const r=pnlOf(o,bars[384].c,385);result='Neither target nor stop was hit by 3:55. Closed there at '+usd(r.sold)+': <b class="'+(r.pnl>=0?'up':'dn')+'">'+sgn(r.pnl)+'</b>. A drift, not a breakout &mdash; theta ate the wait.';}
    steps.push(result);
    out.push('<ol>'+steps.map(x=>'<li>'+x+'</li>').join('')+'</ol>');
  }
  // the biggest move
  const bl=bm.long,bs=bm.short,pick=bl.d>=bs.d?bl:bs,bull=pick===bl,other=bull?bs:bl;
  out.push('<h5>What the day offered &middot; hindsight</h5>');
  if(pick.d>0){
    const o=optionAt(bull,pick.i,bars[pick.i].c,pick.i+1),r=pnlOf(o,bars[pick.j].c,pick.j+1),name=bull?'call':'put';
    out.push('<p>The biggest move was <b>'+P(bars[pick.i].c)+' to '+P(bars[pick.j].c)+'</b> ('+(bull?'+':'−')+(pick.d/bars[pick.i].c*100).toFixed(2)+'%), from <b>'+T(pick.i)+'</b> to <b>'+T(pick.j)+'</b>, '+mins(pick.j-pick.i)+'. The at-the-money 0DTE '+name+' ('+P(o.K)+') cost '+usd(o.q.ask)+' at '+T(pick.i)+' and was worth '+usd(r.sold)+' at '+T(pick.j)+': <b class="'+(r.pnl>=0?'up':'dn')+'">'+sgn(r.pnl)+'</b> on one contract, '+pc(r.pct)+'.'+
      (other.d>0?' The other way, the best '+(bull?'drop':'rally')+' was '+P(other.d)+' from '+T(other.i)+' to '+T(other.j)+'.':'')+
      ' Nobody buys the low and sells the high; the lesson is <b>where the move was</b>: it started at '+T(pick.i)+(pb.none?'':(pick.i>pb.i?', '+mins(pick.i-pb.i)+' after the breakout':pick.i<pb.i?', before the range had even broken':', on the breakout bar itself'))+', and it ran '+mins(pick.j-pick.i)+'.</p>');
  }
  // you
  const n=S.trades.length,net=S.trades.reduce((a,t)=>a+t.total,0);
  out.push('<h5>You</h5><p>'+(n?n+' trade'+(n===1?'':'s')+', <b class="'+(net>=0?'up':'dn')+'">'+sgn(net)+'</b> net of fees'+
    (S.trades.some(t=>t.setup==='orb')?', including the breakout playbook':'')+'. '+(net>=0?'Grade the execution, not the outcome: was it the plan, taken at the level, with the stop honoured?':'A loss taken at the stop, on a real setup, is the cost of doing business. A loss taken anywhere else is the leak.'):
    'No trades. '+(pb.none?'Right call: the day never set up for the playbook.':'The playbook trade was there at '+T(pb.i)+'. If you saw it and passed, write why in the debrief; if you did not see it, that is what to drill.'))+'</p>');
  return out.join('');
}

/* ---- the debrief ---- */
function tile(l,v,c,sub){return '<div class="tile"><span>'+l+'</span><b class="'+(c||'')+'">'+v+'</b>'+(sub?'<i>'+sub+'</i>':'')+'</div>';}
function tone(n){return n==null?'':n>0?'up':n<0?'dn':'';}
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function debrief(){
  const box=$('dbf');if(!box)return;
  const mine=LEDGER.trades.filter(t=>t.sid===S.sid),rec=LEDGER.sessions.find(x=>x.sid===S.sid)||{};
  const net=mine.reduce((a,t)=>a+t.net,0),w=mine.filter(t=>t.net>0).length;
  const flags=[...new Set(mine.flatMap(t=>t.flags))];
  // The day is named here even on a blind day: it is over, so the hindsight is free now.
  $('dbfTitle').textContent=(S.cursor<MPD?'Day ended at '+tlbl(S.cursor):'The 4:00 bell')+' · '+S.ticker+(S.replay?', '+dayName(S.replay.date)+' '+S.replay.date.slice(0,4):'');

function recTrades(){
  let ts=LEDGER.trades.slice().sort((a,b)=>a.at<b.at?-1:1);
  if(recFilter==='rules')ts=ts.filter(t=>t.rulesOn!==false);
  if(recFilter==='clean')ts=ts.filter(t=>!t.rewinds&&!t.repeat);

}
function recStats(ts){
  const n=ts.length,net=ts.reduce((a,t)=>a+t.net,0),fees=ts.reduce((a,t)=>a+(t.fees||0),0);
  const w=ts.filter(t=>t.net>0),l=ts.filter(t=>t.net<0);
  const gw=w.reduce((a,t)=>a+t.net,0),gl=-l.reduce((a,t)=>a+t.net,0);
  const rs=ts.filter(t=>t.R!=null).map(t=>t.R);
  let run=0,peak=0,dd=0,cur=0,best=0,worst=0;const eq=[];
  ts.forEach(t=>{run+=t.net;eq.push(run);peak=Math.max(peak,run);dd=Math.max(dd,peak-run);
    if(t.net>0)cur=cur>0?cur+1:1;else if(t.net<0)cur=cur<0?cur-1:-1;else cur=0;best=Math.max(best,cur);worst=Math.min(worst,cur);});
  return {n,net,fees,wins:w.length,losses:l.length,winRate:n?w.length/n*100:null,
    pf:gl>0?gw/gl:gw>0?Infinity:null,exp:n?net/n:null,avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,nR:rs.length,
    avgWin:w.length?gw/w.length:null,avgLoss:l.length?-gl/l.length:null,
    bigWin:w.length?Math.max(...w.map(t=>t.net)):null,bigLoss:l.length?Math.min(...l.map(t=>t.net)):null,
    maxDD:dd,bestStreak:best,worstStreak:-worst,eq,score:n?ts.reduce((a,t)=>a+(t.score==null?100:t.score),0)/n:null,
    clean:ts.filter(t=>!(t.flags||[]).length).length};
}
const fmtPct=v=>v==null?'—':v.toFixed(0)+'%';

function eqSvg(eq){
  if(eq.length<2)return '<p class="empty" style="margin:0">Two closed trades and the curve appears.</p>';
  const w=900,h=190,pl=8,pr=66,pt=12,pb=18,pw=w-pl-pr,ph=h-pt-pb;
  const lo=Math.min(0,...eq),hi=Math.max(0,...eq),span=hi-lo||1;
  const x=i=>pl+i/(eq.length-1)*pw,y=v=>pt+ph*(1-(v-lo)/span);
  const pts=eq.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const end=eq[eq.length-1],col=end>=0?'#2dd4a7':'#f4525f';
  let peak=-Infinity,pi=0,dd={a:0,b:0,d:0};
  eq.forEach((v,i)=>{if(v>peak){peak=v;pi=i;}if(peak-v>dd.d)dd={a:pi,b:i,d:peak-v};});
  return '<svg class="eq" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img" aria-label="equity curve">'+
    '<defs><linearGradient id="eqg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="'+col+'" stop-opacity=".26"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
    (dd.d>0?'<rect x="'+x(dd.a).toFixed(1)+'" y="'+pt+'" width="'+Math.max(1,x(dd.b)-x(dd.a)).toFixed(1)+'" height="'+ph+'" fill="#f4525f" opacity=".07"/>':'')+
    '<line x1="'+pl+'" y1="'+y(0).toFixed(1)+'" x2="'+(pl+pw)+'" y2="'+y(0).toFixed(1)+'" stroke="#2b3547" stroke-dasharray="3 3"/>'+
    '<polygon points="'+pl+','+y(0).toFixed(1)+' '+pts+' '+x(eq.length-1).toFixed(1)+','+y(0).toFixed(1)+'" fill="url(#eqg)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linejoin="round"/>'+
    '<circle cx="'+x(eq.length-1).toFixed(1)+'" cy="'+y(end).toFixed(1)+'" r="3" fill="'+col+'"/>'+
    '<text x="'+(pl+pw+7)+'" y="'+(y(hi)+4).toFixed(1)+'" fill="#8994a6" font-size="11" font-family="monospace">'+sgn(hi)+'</text>'+
    '<text x="'+(pl+pw+7)+'" y="'+(y(lo)+4).toFixed(1)+'" fill="#8994a6" font-size="11" font-family="monospace">'+sgn(lo)+'</text></svg>';
}

function streakDays(){

  if(!days.size)return 0;
  const d=new Date();d.setHours(12,0,0,0);

  if(!days.has(key()))d.setDate(d.getDate()-1);

let tourI=-1;
function tourShow(i){
  if(i<0)return;

  stopAuto();

  if(st.tab&&S.tab!==st.tab){

  $('tourNext').textContent=i===TOUR.length-1?'Done':'Next';
  const el=st.t?document.querySelector(st.t):null;
  if(el){
    // Line the target up just under the sticky header instead of centring it:
    // centred, a phone has no room left for the card above or below the chart.
    // Targets inside a bar that is actually sticky do not move with the page.
    const bar=el.closest('.top,.actions');
    if(!bar||getComputedStyle(bar).position!=='sticky'){
      const head=document.querySelector('.top'),hh=head?head.getBoundingClientRect().height:0;

  // right -- and again on the next frames and a beat later, in case a font or
  // the scroll settles after. Relying on the frame alone left the spotlight on
  // the previous step wherever frames were being held back.
  tourPlace();

function tourPlace(){
  if(tourI<0)return;
  const st=TOUR[tourI],spot=$('tourSpot'),card=$('tourCard'),box=$('tour');
  const el=st.t?document.querySelector(st.t):null;
  const vw=document.documentElement.clientWidth,vh=innerHeight,cw=Math.min(360,vw-24);

    box.classList.add('center');spot.style.display='none';
    card.style.left=((vw-cw)/2)+'px';
    card.style.top=Math.max(12,(vh-card.offsetHeight)/2)+'px';
    return;
  }
  box.classList.remove('center');
  const r=el.getBoundingClientRect(),pad=6;
  const top0=Math.max(4,r.top-pad),bot0=Math.min(vh-4,r.bottom+pad);

  spot.style.top=top0+'px';
  spot.style.width=(Math.min(vw-4,r.right+pad)-Math.max(4,r.left-pad))+'px';
  spot.style.height=Math.max(0,bot0-top0)+'px';
  const ch=card.offsetHeight;
  let top=bot0+10;
  if(top+ch>vh-10)top=top0-10-ch;          // no room below: above it
  if(top<10)top=vh-ch-12;                  // no room either side: pinned to the bottom
  const left=Math.max(12,Math.min(vw-cw-12,r.left+r.width/2-cw/2));
  card.style.left=left+'px';
  card.style.top=Math.max(10,top)+'px';
}
function tourEnd(){
  tourI=-1;$('tour').hidden=true;
  try{localStorage.setItem('mpGuideSeen','1');}catch(e){}
}
$('tourNext').onclick=()=>tourShow(tourI+1);
$('tourBack').onclick=()=>tourShow(tourI-1);

window.addEventListener('scroll',tourPlace,{passive:true});

/* ================= strips that overflow ================= */
/**
 * Arrows at the edges of any strip wider than its box: the tabs on a phone,
 * the indicator chips, the timeframes, the draw rail. Shown only on the side
 * with more to see, and gone once everything fits.
 */
function stripArrows(el){
  if(!el||el.parentElement.classList.contains('strip'))return;
  const w=document.createElement('div');w.className='strip';
  el.parentNode.insertBefore(w,el);w.appendChild(el);
  const bg=getComputedStyle(el).backgroundColor;
  w.style.setProperty('--sbg',bg&&bg!=='rgba(0, 0, 0, 0)'?bg:getComputedStyle(document.body).backgroundColor);
  const mk=(cls,txt,dir)=>{const b=document.createElement('button');b.type='button';b.className='sa '+cls;b.textContent=txt;
    b.setAttribute('aria-label',dir<0?'Scroll left':'Scroll right');
    b.onclick=()=>el.scrollBy({left:dir*Math.max(120,el.clientWidth*.6),behavior:'smooth'});w.appendChild(b);return b;};
  const L=mk('l','‹',-1),R=mk('r','›',1);
  const upd=()=>{const over=el.scrollWidth-el.clientWidth>4;
    L.classList.toggle('show',over&&el.scrollLeft>4);
    R.classList.toggle('show',over&&el.scrollLeft<el.scrollWidth-el.clientWidth-4);};
  el.addEventListener('scroll',upd,{passive:true});
  window.addEventListener('resize',upd);
  new MutationObserver(upd).observe(el,{childList:true,subtree:true,attributes:true});
  upd();setTimeout(upd,300);
}
['tabs','ov','tfbar','rail'].forEach(id=>stripArrows($(id)));
// A tab picked past the edge scrolls into view -- sideways only. scrollIntoView
// would also move the page up or down to suit itself.
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab'),t=$('tabs');if(!b)return;
  const r=b.getBoundingClientRect(),p=t.getBoundingClientRect();
  if(r.left<p.left+30)t.scrollBy({left:r.left-p.left-34,behavior:'smooth'});
  else if(r.right>p.right-30)t.scrollBy({left:r.right-p.right+34,behavior:'smooth'});});
// The page itself never pinch-zooms: iOS ignores user-scalable=no, so a pinch
// with one finger off the canvas zoomed the page and the chart went with it.
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&e.cancelable)e.preventDefault();},{passive:false});
// Nor does a two-finger drag on the chart scroll the page underneath.
document.querySelector('.chartbox').addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();},{passive:false});

/* ================= hints ================= */
/** A short note over the chart: what a tool does as you pick it, or an indicator as it turns on. */
let hintT=null;
function hint(t){
  const h=$('hint');if(!h||!t)return;
  h.textContent=t;h.hidden=false;
  requestAnimationFrame(()=>h.classList.add('show'));
  clearTimeout(hintT);
  hintT=setTimeout(()=>{h.classList.remove('show');setTimeout(()=>{if(!h.classList.contains('show'))h.hidden=true;},260);},4200);
}
const TOOL_HINT={
  cursor:'Pointer: drag to pan the chart, hover or touch a candle to read it.',
  trend:'Trend line: press and drag from one point to another.',
  hline:'Level: tap the price you want to mark.',
  fib:'Fib retracement: drag from a swing low to a swing high, or high to low.',
  rect:'Box: drag across the zone you want to mark.',
  measure:'Measure: drag to see a move in dollars, percent and bars.',
  erase:'Eraser: tap a drawing to delete it.'
};

/* ================= sessions ================= */
function dayName(d){const x=new Date(d+'T12:00:00Z');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x.getUTCDay()]+' '+(x.getUTCMonth()+1)+'/'+x.getUTCDate();}
/** The day picker in the header: recorded dates for this ticker, newest first. */
function renderSessRow(){
  const sel=$('sdate');if(!sel)return;
  if(!REPLAY.length){sel.innerHTML='<option>Generated day</option>';sel.disabled=true;return;}
  if(S.blind){sel.innerHTML='<option>Blind day · revealed at the bell</option>';sel.disabled=true;return;}
  const ds=PICK.filter(r=>r.symbol===S.ticker).map(r=>r.date).sort().reverse();
  sel.disabled=false;
  sel.innerHTML=ds.map(d=>{
    // A day with nothing recorded before it opens on a handful of candles with
    // empty higher timeframes. Still pickable, but labelled so it is no surprise.
    const depth=REPLAY.filter(x=>x.symbol===S.ticker&&x.date<d).length;
    const note=depth===0?' · no history':depth<MIN_HIST?' · thin history':'';
    return '<option value="'+d+'"'+(S.replay&&S.replay.date===d?' selected':'')+'>'+dayName(d)+note+'</option>';
  }).join('');
}
/**
 * Every way of leaving a session comes through here: a ticker change, a new
 * day, a restart, or the Session pane. Closed practice trades wait in a queue
 * until the bell so a rewind can unmake them, which means starting over would
 * otherwise discard trades that genuinely closed. They are sent first. An open
 * position never closed, so it is not a trade; leaving one behind asks first.
 */
function startSession(ticker,pick,o){
  o=o||{};
  if(S.pos&&!confirm('You have an open position. Leave it and start a new session?'))return false;
  stopAuto();
  if(S.pendingJournal&&S.pendingJournal.length)flushJournal('session change');
  if(S.pendingLedger)commitSession(false);
  init(ticker,o.regime??S.regime,o.vm??S.vm,o.seed,pick);
  return true;
}

/* ================= wiring ================= */
const tkSel=$('tk');
const PICKABLE=PICK.length?[...new Set(PICK.map(r=>r.symbol))].sort():Object.keys(TICKERS);
PICKABLE.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tkSel.appendChild(o);});
tkSel.onchange=()=>{if(!startSession(tkSel.value))tkSel.value=S.ticker;};
$('sdate').onchange=e=>{if(!startSession(S.ticker,{symbol:S.ticker,date:e.target.value}))renderSessRow();};
$('sRestart').onclick=()=>startSession(S.ticker,S.replay?{symbol:S.ticker,date:S.replay.date}:null,{seed:S.seed});
$('sNew').onclick=()=>{
  // A different day for the same ticker, not a reroll that lands on this one.
  const cur=S.replay&&S.replay.date;let p=randomReplay(S.ticker),k=0;
  while(p&&cur&&p.date===cur&&k++<12)p=randomReplay(S.ticker);
  startSession(p?p.symbol:S.ticker,p);
};
const tfbar=$('tfbar');
TFS.forEach(t=>{const b=document.createElement('button');b.className='tf'+(t.k==='5m'?' on':'');b.textContent=t.k;
  b.onclick=()=>{document.querySelectorAll('.tf').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    S.tf=t.k;S.cache={};S.view.right=null;S.yMan=null;
    S.view.count=window.innerWidth<600?46:80;renderAll();};
  tfbar.appendChild(b);});
const INDS=[
  ['fib','auto fib','Fib retracements and extensions of the last swing on the chart, following it as it runs'],
  ['or','range','Opening range: the high and low of the first 15 minutes'],
  ['lvl','levels','Prior day high, low and close, the pre-market high and low, and the open: the levels the day is traded against'],
  ['ext','ext hrs','Pre-market from 4:00 and after-hours to 8:00, in 5-minute bars, tinted'],
  ['vwap','vwap','VWAP: the average price paid since the open, weighted by volume'],
  ['ema9','ema9','9-bar exponential moving average: the fastest trend line'],
  ['ema20','ema20','20-bar exponential moving average'],
  ['ema50','ema50','50-bar exponential moving average: the slower trend'],
  ['bb','boll','Bollinger bands: the 20-bar average plus and minus two standard deviations'],
  ['rsi','rsi','RSI 14: momentum from 0 to 100. Above 70 is stretched, below 30 washed out'],
  ['vol','vol','Volume bars under the chart'],
  ['magnet','magnet','Magnet: drawings snap to the nearest open, high, low or close']];
const CTYPES=[['candle','Candles'],['hollow','Hollow'],['heikin','Heikin Ashi'],
  ['bar','OHLC bars'],['line','Line'],['area','Area']];
function renderBadges(){
  $('ov').innerHTML=
    '<select class="ctsel" id="ctsel" title="Chart type">'+
      CTYPES.map(([k,l])=>'<option value="'+k+'"'+(S.ctype===k?' selected':'')+'>'+l+'</option>').join('')+
    '</select>'+
    INDS.map(([k,l,d])=>'<button class="badge'+(S.ind[k]?' on':'')+'" data-i="'+k+'" title="'+d+'" aria-label="'+l+': '+d+'">'+l+'</button>').join('');
  $('ctsel').onchange=e=>{S.ctype=e.target.value;draw();};
}
$('ov').addEventListener('click',e=>{const b=e.target.closest('.badge');if(!b)return;
  const k=b.dataset.i;S.ind[k]=!S.ind[k];b.classList.toggle('on',!!S.ind[k]);resize();
  if(S.ind[k]){const e=INDS.find(x=>x[0]===k);if(e)hint(e[2]);}});
$('rail').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='undo'){hint(S.draw.length?'Removed the last drawing.':'Nothing to undo.');S.draw.pop();return draw();}
  if(b.id==='clear'){hint(S.draw.length?'Cleared '+S.draw.length+' drawing'+(S.draw.length===1?'':'s')+'.':'No drawings to clear.');S.draw=[];return draw();}
  document.querySelectorAll('.tool[data-t]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');S.tool=b.dataset.t;hint(TOOL_HINT[S.tool]);});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');S.tab=b.dataset.p;pane();});
function stepBar(){
  if(S.cursor>=MPD)return;
  snapshot();
  const t=tfMin();stepMinutes(Math.max(1,t==='D'?MPD-S.cursor:t));
  if(S.view.right!=null&&S.view.right>=bars().length-2)S.view.right=null;
  if(S.cursor>=MPD)bell();
  renderAll();}
$('next').onclick=stepBar;
$('back').onclick=()=>{stopAuto();stepBack();};
$('spd').onchange=e=>{S.speed=parseFloat(e.target.value);if(S.auto){stopAuto();$('auto').click();}};
function stopAuto(){if(S.auto){clearInterval(S.auto);S.auto=null;$('auto').textContent='▶';}}
$('auto').onclick=()=>{if(S.auto)return stopAuto();$('auto').textContent='❚❚';
  S.auto=setInterval(()=>{if(S.cursor>=MPD)return stopAuto();stepBar();},Math.round(700/(S.speed||1)));};
document.addEventListener('keydown',e=>{
  if($('rec')&&!$('rec').hidden){if(e.key==='Escape')closeRecord();return;}
  if($('dbf')&&!$('dbf').hidden){if(e.key==='Escape')$('dbf').hidden=true;return;}
  if(tourI>=0){
    if(e.key==='Escape')tourEnd();
    else if(e.key==='ArrowRight')tourShow(tourI+1);
    else if(e.key==='ArrowLeft')tourShow(tourI-1);
    if(e.key!=='Enter'&&e.key!==' '&&e.key!=='Tab')e.preventDefault();
    return;
  }
  if(/input|select|textarea/i.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(e.key==='ArrowRight'){e.preventDefault();stepBar();}
  else if(e.key==='ArrowLeft'){e.preventDefault();stopAuto();stepBack();}
  else if(e.key===' '){e.preventDefault();$('auto').click();}
  else if(k==='l')buy(true);
  else if(k==='s')buy(false);
  else if(k==='x'&&S.pos)trim(1);
  else if(k==='u'){S.draw.pop();draw();}
  else if(k==='escape')document.querySelector('.tool[data-t="cursor"]').click();
});
(function(){const first=randomReplay();init(first?first.symbol:'SPY','random',1,undefined,first);})();
(function(){let seen=true;try{seen=!!localStorage.getItem('mpGuideSeen');}catch(e){}
  if(!seen)setTimeout(()=>tourShow(0),700);})();
