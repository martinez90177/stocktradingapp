<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>Open Range — options & shares practice</title>
<style>
:root{
  --bg:#080b10;--panel:#0f141c;--p2:#151c26;--line:#1c2430;--line2:#28323f;
  --text:#dfe6ef;--dim:#7b8695;--up:#26a37a;--dn:#e0524a;--fib:#c9a227;--acc:#6d9cf5;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;overscroll-behavior:none;}
button,input,select{font-family:inherit;color:var(--text);font-size:14px;}
button{cursor:pointer;background:var(--p2);border:1px solid var(--line2);border-radius:8px;padding:0 12px;min-height:38px;}
button:active:not(:disabled){transform:scale(.97);}
button:disabled{opacity:.3;}
input,select{background:var(--p2);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;
  width:100%;font-family:var(--mono);font-size:15px;}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.up{color:var(--up);}.dn{color:var(--dn);}

.top{position:sticky;top:0;z-index:20;background:rgba(8,11,16,.94);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;}
.row1{display:flex;align-items:center;gap:10px;}
.tksel{background:transparent;border:none;font-size:19px;font-weight:700;padding:0 18px 0 0;min-height:0;width:auto;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 8px) 10px,calc(100% - 3px) 10px;background-size:5px 5px;background-repeat:no-repeat;}
.px{font-family:var(--mono);font-size:19px;font-weight:600;}
.chg{font-family:var(--mono);font-size:12.5px;padding:2px 7px;border-radius:5px;}
.chg.u{color:var(--up);background:rgba(38,163,122,.14);}
.chg.d{color:var(--dn);background:rgba(224,82,74,.14);}
.clk{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right;line-height:1.3;}
.ohlc{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;height:14px;white-space:nowrap;overflow:hidden;}
.ohlc b{color:var(--text);font-weight:500;}
.clkx{font-size:10px;}
.sessrow{display:flex;gap:7px;align-items:center;margin-top:8px;}
.ssel{flex:0 1 240px;min-width:0;width:auto;min-height:34px;padding:0 10px;font-size:12.5px;}
.sbtn{flex:0 0 auto;min-height:34px;padding:0 12px;font-size:12.5px;white-space:nowrap;}
.sbtn.sprim{border-color:var(--acc);}

.tfbar{display:flex;gap:5px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none;
  border-bottom:1px solid var(--line);background:var(--bg);}
.tfbar::-webkit-scrollbar{display:none;}
.tf{flex:0 0 auto;min-height:32px;padding:0 13px;border-radius:16px;font-family:var(--mono);font-size:13px;
  background:transparent;border:1px solid var(--line2);color:var(--dim);}
.tf.on{background:var(--acc);border-color:var(--acc);color:#06090f;font-weight:700;}

.chartbox{position:relative;background:#0a0e14;}
canvas{display:block;width:100%;touch-action:none;}
.ov{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none;}
.ov::-webkit-scrollbar{display:none;}
.badge{flex:0 0 auto;font-size:12.5px;min-height:32px;padding:0 12px;border-radius:8px;font-weight:600;
  background:transparent;border:1px solid var(--line2);color:var(--dim);display:grid;place-items:center;}
.badge.on{color:var(--text);border-color:var(--acc);}
.strip{position:relative;min-width:0;}
.strip .sa{position:absolute;top:0;bottom:0;width:34px;min-height:0;padding:0;border:none;border-radius:0;z-index:3;color:var(--acc);font-size:20px;font-weight:700;display:none;}
.strip .sa.l{left:0;background:linear-gradient(90deg,var(--sbg) 55%,transparent);}
.strip .sa.r{right:0;background:linear-gradient(270deg,var(--sbg) 55%,transparent);}
.strip .sa.show{display:block;}
.ctsel{font-family:var(--mono);font-size:10.5px;padding:3px 18px 3px 7px;width:auto;min-height:0;
  border-radius:5px;background-color:rgba(15,20,28,.9);border:1px solid var(--line2);color:var(--text);
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 9px) 8px,calc(100% - 5px) 8px;background-size:4px 4px;background-repeat:no-repeat;}
.fitbtn{position:absolute;right:60px;bottom:26px;font-family:var(--mono);font-size:10.5px;padding:4px 9px;
  min-height:0;background:rgba(109,156,245,.16);border:1px solid var(--acc);color:var(--acc);display:none;}
.fitbtn.show{display:block;}

.rail{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--panel);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);scrollbar-width:none;}
.rail::-webkit-scrollbar{display:none;}
.tool{flex:0 0 auto;width:42px;height:38px;display:grid;place-items:center;padding:0;background:transparent;border:1px solid var(--line2);}
.tool.on{background:var(--acc);border-color:var(--acc);}
.tool.on svg{stroke:#06090f;}
.tool svg{width:18px;height:18px;fill:none;stroke:var(--dim);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.rail .lbl{flex:0 0 auto;align-self:center;font-size:11px;color:var(--dim);}

/* Two rows, each with its own track sizes. A single grid cannot do this:
   the side buttons would inherit the transport columns and come out uneven. */
.actions{position:sticky;bottom:0;z-index:18;display:flex;flex-direction:column;gap:7px;
  padding:9px 12px calc(env(safe-area-inset-bottom) + 9px);background:rgba(8,11,16,.96);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);}
.trow{display:grid;grid-template-columns:46px 1fr 46px 76px;gap:7px;}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.actions button{min-height:46px;font-weight:600;font-size:14px;padding:0 4px;white-space:nowrap;}
.actions select{min-height:46px;padding:0 4px;font-size:12.5px;text-align:center;}
.actions #back,.actions #auto{font-size:15px;padding:0;}
.bnext{background:var(--acc);border-color:var(--acc);color:#06090f;}
.blong{border-color:var(--up);color:var(--up);background:rgba(38,163,122,.10);}
.bshort{border-color:var(--dn);color:var(--dn);background:rgba(224,82,74,.10);}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;min-height:34px;padding:0 13px;font-size:13px;background:transparent;border:1px solid transparent;
  color:var(--dim);border-radius:8px 8px 0 0;}
.tab.on{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);color:var(--text);}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;margin:0 12px 14px;padding:13px;min-height:190px;}
h3{font-size:12px;color:var(--dim);font-weight:600;margin:0 0 9px;}
h3.sp{margin-top:16px;}
.empty{color:var(--dim);font-size:13.5px;line-height:1.5;}

.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:9px;overflow:hidden;margin-bottom:12px;}
.seg button{flex:1;border:none;border-radius:0;background:transparent;min-height:40px;color:var(--dim);}
.seg button.on{background:var(--acc);color:#06090f;font-weight:700;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
.chips button{min-height:34px;font-size:11.5px;font-family:var(--mono);padding:0 10px;}
.chips button.on{border-color:var(--acc);color:var(--text);background:rgba(109,156,245,.12);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.grid2 label{font-size:11.5px;color:var(--dim);}
.grid2 label span{display:block;margin-bottom:4px;}
.quote{background:var(--p2);border:1px solid var(--line2);border-radius:9px;padding:10px;margin-top:11px;}
.quote .big{font-family:var(--mono);font-size:17px;font-weight:600;}
.greeks{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:7px;}
.greeks b{color:var(--text);font-weight:500;}
.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13.5px;padding:5px 0;border-bottom:1px dotted var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--dim);}
.mgmt{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px;}
.mgmt button{min-height:40px;font-size:13px;}
.fibrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;padding:7px 8px;border-radius:6px;}
.fibrow+.fibrow{margin-top:1px;}
.fibrow .k{color:var(--dim);}
.fibrow.ext .k{color:var(--fib);}
.fibrow.edge{background:rgba(109,156,245,.10);}
.fibrow.edge .k{color:var(--acc);}
.fibrow.near{outline:1px solid var(--line2);}
.fibrow small{color:var(--dim);font-size:10.5px;margin-left:5px;}
.tape div{font-family:var(--mono);font-size:12.5px;color:var(--dim);padding:2.5px 0;line-height:1.45;}
.tape .hl{color:var(--text);}.tape .g{color:var(--up);}.tape .r{color:var(--dn);}.tape .y{color:var(--fib);}
.scroll{max-height:270px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;}
th{text-align:left;color:var(--dim);font-weight:500;padding:5px 4px;border-bottom:1px solid var(--line2);}
td{padding:6px 4px;border-bottom:1px solid var(--line);}
tr.atm td{background:rgba(109,156,245,.10);}
tr.pick td{outline:1px solid var(--acc);}
.chain td{cursor:pointer;}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;margin-bottom:11px;}
.stats span{color:var(--dim);}
.gr{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);}
.gr:last-child{border-bottom:none;}
.gr .m{font-family:var(--mono);font-size:14px;line-height:1.3;}
.gr .m.ok{color:var(--up);}.gr .m.bad{color:var(--dn);}.gr .m.mid{color:var(--fib);}.gr .m.h{color:var(--acc);}
.gr .b{font-size:13.5px;line-height:1.5;}
.setup{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.setup select{width:auto;flex:1;min-width:130px;}
.seed{font-family:var(--mono);font-size:12px;color:var(--acc);background:var(--p2);border:1px solid var(--line2);
  border-radius:7px;padding:8px 10px;}
footer{color:#525c69;font-size:11px;text-align:center;padding:0 20px 26px;line-height:1.5;}
/* On a phone the chip strip is not an overlay. Ten indicator chips and a
   chart-type picker wrap to two rows and bury the candles underneath them,
   so below 900px they sit in their own scrolling strip under the chart. */
@media(max-width:899px){
  .ov{position:static;max-width:none;flex-wrap:nowrap;overflow-x:auto;gap:6px;
    padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .ov::-webkit-scrollbar{display:none;}
  .badge{flex:0 0 auto;min-height:30px;font-size:11.5px;padding:0 11px;background:transparent;}
  .ctsel{flex:0 0 auto;min-height:30px;font-size:11.5px;padding:0 20px 0 9px;
    background-position:calc(100% - 9px) 13px,calc(100% - 5px) 13px;}
  /* the chart is no longer covered top-left, so auto fit moves out of the volume */
  .fitbtn{left:auto;right:70px;top:9px;bottom:auto;}
  .tfbar{padding:8px 12px 6px;}
  .acct{gap:10px;font-size:11.5px;padding:6px 9px}
  .ohlc{display:none;}
}
@media(min-width:900px){
  .wrap{max-width:1300px;margin:0 auto;display:grid;grid-template-columns:1fr 340px;gap:14px;padding:0 14px 20px;align-items:start;}
  .left{min-width:0;}
  .right{position:sticky;top:112px;}
  .pane{margin:0 0 12px;}
  .actions{position:static;background:transparent;backdrop-filter:none;border-top:none;padding:10px 0 0;}
  .chartbox{border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .rail{border-radius:10px;margin-top:10px;border:1px solid var(--line);}
  footer{grid-column:1/-1;}
}
/* ---- draw rail: every tool says what it is ---- */
.tool{width:54px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tool small{font-size:10px;line-height:1;color:var(--dim);font-weight:600;letter-spacing:.1px}
.tool.on small{color:var(--text)}
.tool:hover{border-color:var(--acc)}

/* ---- a note over the chart ---- */
.hint{position:absolute;left:50%;top:40px;transform:translate(-50%,-4px);max-width:calc(100% - 110px);z-index:6;
  background:rgba(13,18,32,.96);border:1px solid var(--acc);color:var(--text);font-size:12.5px;line-height:1.4;
  padding:7px 12px;border-radius:9px;text-align:center;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;
  box-shadow:0 6px 24px rgba(0,0,0,.45)}
.hint.show{opacity:1;transform:translate(-50%,0)}
.hint[hidden]{display:none}

/* ---- guide ---- */
.sbtn.sq{width:34px;padding:0;font-size:15px;font-weight:700}
.mp-guide{margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--acc);border-radius:8px;
  padding:9px 14px;background:rgba(123,108,246,.14);color:var(--text);font-weight:650;font-size:13px;min-height:0}
.mp-guide + .mp-back{margin-left:0}
.tour{position:fixed;inset:0;z-index:100}
.tour[hidden]{display:none}
.tour.center{background:rgba(3,5,10,.72)}
.tour-spot{position:fixed;border-radius:10px;border:2px solid var(--acc);box-shadow:0 0 0 9999px rgba(3,5,10,.72);
  pointer-events:none}
.tour-card{position:fixed;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:15px 16px 13px;
  box-shadow:0 18px 50px rgba(0,0,0,.6)}
.tour-step{font-family:var(--mono);font-size:11px;color:var(--acc);font-weight:600;letter-spacing:.4px}
.tour-card h4{margin:6px 0;font-size:16px;letter-spacing:-.2px}
.tour-card p{margin:0;color:#c3cad6;font-size:13.5px;line-height:1.55}
.tour-nav{display:flex;gap:8px;align-items:center;margin-top:14px}
.tour-nav button{min-height:36px;padding:0 14px;font-size:13px}
.tour-skip{margin-right:auto;background:transparent;border-color:transparent;color:var(--dim);padding-left:0}
.tour-next{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---- ticket ---- */
h3 i{font-style:normal;text-transform:none;letter-spacing:0;color:var(--dim);font-weight:500;margin-left:4px}
.seg.exp button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:50px}
.seg.exp b{font-family:var(--mono);font-size:13px}
.seg.exp small{font-size:10.5px;color:var(--dim);font-weight:500}
.seg.exp button.on small{color:var(--text)}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper button{min-height:42px;font-size:19px;padding:0;font-weight:500;line-height:1}
.stepper select,.stepper input{min-height:42px;text-align:center;text-align-last:center;font-family:var(--mono);font-size:14px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.oc{border:1px solid var(--line2);border-radius:10px;padding:10px 11px 9px;background:var(--p2);min-width:0}
.oc.call{border-color:rgba(45,212,167,.38);background:linear-gradient(180deg,rgba(45,212,167,.08),rgba(45,212,167,0) 55%),var(--p2)}
.oc.put{border-color:rgba(244,82,95,.38);background:linear-gradient(180deg,rgba(244,82,95,.08),rgba(244,82,95,0) 55%),var(--p2)}
.oc .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.oc.call .hd{color:var(--up)}
.oc.put .hd{color:var(--dn)}
.oc .hd span{color:var(--dim);font-weight:500;letter-spacing:0;text-transform:none;font-size:11px;white-space:nowrap}
.oc .ask{font-family:var(--mono);font-size:22px;font-weight:600;margin:6px 0 3px;letter-spacing:-.5px}
.oc .ask small{font-family:var(--sans);font-size:11px;color:var(--dim);font-weight:500;letter-spacing:0;margin-left:5px}
.oc .ln{font-family:var(--mono);font-size:11.5px;color:var(--dim);line-height:1.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oc .ln b{color:var(--text);font-weight:600}
.oc .cost{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.oc .cost b{display:block;margin-top:2px;color:var(--text);font-family:var(--mono);font-size:14px;font-weight:600}
.meta{font-size:12px;color:var(--dim);margin-top:9px;line-height:1.55}
.meta b{color:var(--text);font-weight:600}
.meta.tight{margin-top:-3px}
.stepline{display:grid;gap:6px}
.stepline label{font-size:10.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.9px;font-weight:600}
.plan{background:var(--p2);border:1px solid var(--line2);border-radius:9px;padding:10px 12px;margin-top:10px}
.plan .r{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;padding:3px 0}
.plan .r span{color:var(--dim)}
.plan .r b{font-family:var(--mono);font-size:13.5px;font-weight:600}
.plan .note{margin:6px 0 0;font-size:11.5px;color:var(--dim);line-height:1.5}
.plan .r + .note{border-top:1px solid var(--line);padding-top:7px}
.plan .note:first-child{margin-top:0}
.plan .note.warn{color:var(--fib)}
.chk{display:flex;gap:9px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--dim);cursor:pointer}
.chk input{width:auto;min-height:0;accent-color:var(--acc)}
.posline{font-family:var(--mono);font-size:14.5px;font-weight:600;margin:0 0 6px}
/* ---- the side cards are the buy buttons ---- */
button.oc{display:block;width:100%;text-align:left;font-weight:400;min-height:0;color:var(--text);cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .08s}
button.oc > span{display:block}
button.oc > .hd{display:flex}
.oc.call:hover:not(:disabled){border-color:var(--up);box-shadow:0 0 0 1px var(--up)}
.oc.put:hover:not(:disabled){border-color:var(--dn);box-shadow:0 0 0 1px var(--dn)}
.oc.call:focus-visible{outline:2px solid var(--up);outline-offset:2px}
.oc.put:focus-visible{outline:2px solid var(--dn);outline-offset:2px}
button.oc:disabled{opacity:.5;cursor:not-allowed}
.oc .go{margin-top:9px;padding:8px 10px 9px;border-radius:8px;font-size:12px;font-weight:700;line-height:1.3}
.oc .go b{display:block;margin-top:2px;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text)}
.oc.call .go{background:rgba(45,212,167,.17);color:var(--up)}
.oc.put .go{background:rgba(244,82,95,.17);color:var(--dn)}
button.oc:disabled .go{background:rgba(137,148,166,.12);color:var(--dim)}
button.oc:disabled .go b{display:none}
/* On a desktop the chart stays pinned while the ticket scrolls beside it. The
   buy cards sit under the size and order settings, below the fold on a laptop,
   and scrolling down to them used to take the chart out of view. Only where the
   window is tall enough to hold the whole chart column. */
@media(min-width:900px) and (min-height:760px){
  .left{position:sticky;top:146px}
  .right{position:static}
}
/* ---- a report the model cannot price ---- */
.evwarn{display:block;margin-bottom:7px;padding:8px 10px;border-radius:8px;border:1px solid rgba(245,165,36,.4);
  background:rgba(245,165,36,.1);color:#f5c060;font-weight:600;line-height:1.45}
/* ---- percent moves ---- */
.oc .ask em{display:block;font-family:var(--mono);font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:0;margin-top:2px}
.oc .ask em.up{color:var(--up)}
.oc .ask em.dn{color:var(--dn)}
.kv .pp{font-weight:700;margin-left:4px}
.posbar{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1300px;margin:8px auto 0;
  padding:7px 11px;border-radius:9px;font-size:13px;border:1px solid var(--line2);background:var(--p2)}
.posbar[hidden]{display:none}

<script>
/* ================= config ================= */
const TICKERS={
  SPY :{px:585,v:.00075,iv:.13,inc:1},
  QQQ :{px:498,v:.00095,iv:.17,inc:1},
  MSFT:{px:432,v:.0012,iv:.24,inc:2.5},
  DELL:{px:121,v:.0021,iv:.42,inc:1},
  AMD :{px:163,v:.0027,iv:.48,inc:1},
  NVDA:{px:139,v:.0030,iv:.50,inc:1},
  TSLA:{px:262,v:.0035,iv:.58,inc:2.5}
};
/**
 * Config for a symbol. Recorded sessions can carry any ticker, so an unknown
 * one gets an increment derived from its price and a middling vol base instead
 * of crashing the pane that asks for it.
 */
function cfg(t){
  const known=TICKERS[t];
  if(known)return known;
  let px=100;
  try{px=price();}catch(e){}
  const inc=px>=500?5:px>=200?2.5:px>=40?1:px>=10?.5:.25;
  return {px,v:.002,iv:.35,inc};
}
const TFS=[{k:'1m',m:1},{k:'2m',m:2},{k:'5m',m:5},{k:'10m',m:10},{k:'15m',m:15},
  {k:'30m',m:30},{k:'1H',m:60},{k:'4H',m:240},{k:'1D',m:'D'}];
const MPD=390,HIST=34,OR_MIN=15,LV=[0,.236,.382,.5,.618,.786,1],YEAR=252*390;
let S={};
const $=id=>document.getElementById(id);
const val=id=>{const e=$(id);return e?e.value:'';};
const money=n=>(n<0?'-$':'$')+Math.abs(n).toFixed(2);
const sgn=n=>(n>=0?'+$':'−$')+Math.abs(n).toFixed(2);
function mul32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================= black-scholes ================= */
function ncdf(x){const t=1/(1+.2316419*Math.abs(x));
  const d=.3989423*Math.exp(-x*x/2);
  let p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return x>0?1-p:p;}
function npdf(x){return .3989423*Math.exp(-x*x/2);}
function bs(S0,K,T,iv,type){
  T=Math.max(T,1e-7);
  const r=.04,sq=iv*Math.sqrt(T);
  const d1=(Math.log(S0/K)+(r+iv*iv/2)*T)/sq, d2=d1-sq;
  const disc=Math.exp(-r*T);
  const call=S0*ncdf(d1)-K*disc*ncdf(d2);
  const put=K*disc*ncdf(-d2)-S0*ncdf(-d1);
  const price=type==='call'?call:put;
  const delta=type==='call'?ncdf(d1):ncdf(d1)-1;
  const gamma=npdf(d1)/(S0*sq);
  const theta=(-(S0*npdf(d1)*iv)/(2*Math.sqrt(T))
    -(type==='call'?1:-1)*r*K*disc*(type==='call'?ncdf(d2):ncdf(-d2)))/YEAR; // per minute-bar unit
  const vega=S0*npdf(d1)*Math.sqrt(T)/100;
  return {price:Math.max(price,0),delta,gamma,theta,vega};
}
/* ================= option pricing ================= */
/*
 * The candles are recorded; option prices are modelled, because historical
 * intraday option quotes are not given away. What decides whether a model is
 * honest is the volatility it uses, and that part is no longer invented.
 *
 * It used to be a constant per ticker, set when this app was written (QQQ 17%,
 * from when QQQ traded near 500; NVDA 50%; any other ticker 35%), then marked
 * up 55% for 0DTE with a smile that made every out-of-the-money option dearer.
 * Against real closing prices on Sep 10 that put NVDA options at about 78%
 * volatility when the market charged 34%, and TSLA at 90% against 41%.
 *
 * Now the level comes from the day being replayed: VXN (Nasdaq-100 options) or
 * VIX (S&P 500 options), read at the minute on screen -- never ahead of it --
 * or that morning's opening level where no minute record exists. Each ticker
 * is scaled by how its own options traded relative to that index, measured
 * from real trades by tools/calibrate-vol.mjs, with the skew measured the same
 * way. Nothing here is a guess about a ticker's volatility.
 */
const VOLD=window.MP_VOL||{};
const VCALS=(window.MP_VOLCAL||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
const ETFS={SPY:1,QQQ:1,IWM:1,DIA:1};
/**
 * The calibration to price a ticker with: the latest one measured before the
 * replayed day, so nothing from after it is used. For days older than the first
 * measurement, the earliest one is carried back, and the page says so.
 */
function calFor(sym){
  const d=S.replay?S.replay.date:null,have=VCALS.filter(c=>c.symbols&&c.symbols[sym]);
  if(!have.length)return null;
  const before=d?have.filter(c=>c.date<d):have;
  const c=before.length?before[before.length-1]:have[0];
  return Object.assign({},c.symbols[sym],{date:c.date,refLevel:c.index[c.symbols[sym].index],carried:!before.length&&!!d});
}
/** A ticker nobody has measured yet is priced like the typical measured stock, and labelled as such. */
function typicalRatio(idx){
  const last=VCALS[VCALS.length-1];if(!last)return null;
  const r=Object.entries(last.symbols).filter(([s,v])=>v.index===idx&&!ETFS[s]).map(([,v])=>v.ratio).sort((a,b)=>a-b);
  return r.length?r[Math.floor(r.length/2)]:null;
}
/** The index level at a minute of the replayed day: the last closed minute, never a later one. */
function indexAt(name,min){
  const d=S.replay&&S.replay.date,rec=VOLD[name]&&VOLD[name][d];
  if(rec&&rec.m&&rec.m.length)return {v:rec.m[Math.max(0,Math.min(rec.m.length-1,Math.round(min)-1))],src:'minute'};
  if(rec&&rec.o!=null)return {v:rec.o,src:'open'};
  return null;
}
function volModel(min){
  const sym=S.ticker,cal=calFor(sym),name=cal?cal.index:(sym==='SPY'||sym==='IWM'||sym==='DIA'?'VIX':'VXN');
  const lv=indexAt(name,min),last=VCALS[VCALS.length-1];
  const ratio=cal?cal.ratio:typicalRatio(name);
  const level=lv?lv.v:(cal?cal.refLevel:(last&&last.index[name]));
  if(ratio==null||level==null){
    // Only reachable in a build with no calibration at all. Say so rather than
    // quietly inventing a number.
    return {atm:cfg(sym).iv,skew:0,skewT:1,index:name,level:null,src:'none',cal:null,typical:false};
  }
  return {atm:ratio*level/100,skew:cal?cal.skew:0,skewT:cal?cal.skewT:1,index:name,level,
    src:lv?lv.src:'reference',cal,typical:!cal};
}
function ivFor(K,S0,exDays,min){
  const m=volModel(min),x=Math.log(K/S0);
  // Skew was measured per unit of log-moneyness at skewT days out. The same
  // move in strike means less as the time left grows, so it scales with 1/sqrt(T).
  const Td=Math.max(.25,Math.max(0,MPD-min)/MPD+exDays);
  const k=m.skew*Math.sqrt(m.skewT/Td);
  const xc=Math.max(-.06,Math.min(.06,x));      // measured within 2% of spot; held flat past 6%
  return Math.max(m.atm*.5,Math.min(m.atm*2.5,m.atm+k*xc));
}
function Tleft(exDays,min){
  const at=min==null?S.cursor:min;
  return (Math.max(0,MPD-at)+exDays*MPD)/YEAR;
}
/**
 * Bid and ask around the model's mid, on the exchange's own ticks: SPY and QQQ
 * options trade in pennies at any price and run a cent or two wide near the
 * money; stock options trade in pennies under $3 and nickels above, and run a
 * little wider. The old spread was 3.6% of the price plus 2.4 cents -- 13 cents
 * on a $3 QQQ option -- so every practice round trip lost money a real one
 * would not have.
 */
function spreadOf(mid){
  const etf=!!ETFS[S.ticker],tick=etf||mid<3?.01:.05;
  const width=Math.max(tick,Math.round((etf?Math.max(.01,mid*.005):Math.max(.02,mid*.012))/tick)*tick);
  if(mid<tick)return {bid:0,ask:tick};
  const bid=Math.max(0,Math.floor((mid-width/2)/tick+1e-9)*tick);
  return {bid:+bid.toFixed(2),ask:+(bid+width).toFixed(2)};
}
/** A quote for one contract. `atMin` prices it at another minute of the day; the default is now. */
function quote(K,type,exDays,under,atMin){
  const min=atMin==null?S.cursor:atMin;
  const T=Tleft(exDays,min),iv=ivFor(K,under,exDays,min);
  const g=bs(under,K,T,iv,type);
  const mid=Math.max(0,g.price),sp=spreadOf(mid);
  return {...g,mid,bid:sp.bid,ask:sp.ask,iv,T,thetaHr:g.theta*60};
}
/** The same contract at 9:30, on the day's opening price: what "up or down today" is measured from. */
function openQuote(K,type,exDays){
  return quote(K,type,exDays,S.mins[todayStart()].o,0);
}
/** "+34.2%" and its colour class, or an empty string when there is nothing to compare. */
function pctTxt(now,ref){
  if(!(ref>0))return {t:'',c:''};
  const p=(now/ref-1)*100;
  return {t:(p>=0?'+':'−')+Math.abs(p).toFixed(Math.abs(p)>=100?0:1)+'%',c:p>=0?'up':'dn'};
}
/* Earnings reports this model cannot price -- see volatility/events.json. */
const EVENTS=window.MP_EVENTS||{};
function addTradingDays(d,n){const x=new Date(d+'T12:00:00Z');let k=0;
  while(k<n){x.setUTCDate(x.getUTCDate()+1);if(x.getUTCDay()%6)k++;}return x.toISOString().slice(0,10);}
/**
 * A warning when a report falls inside the contract's life. Real options

function eventNote(exDays){
  const d=S.replay&&S.replay.date;if(!d)return '';
  const exp=addTradingDays(d,exDays);
  const ev=(EVENTS[S.ticker]||[]).find(e=>e.timing==='amc'?(e.date>=d&&e.date<exp):
    e.timing==='bmo'?(e.date>d&&e.date<=exp):(e.date>=d&&e.date<=exp));
  if(!ev)return '';
  const when=ev.timing==='amc'?'after the close on ':ev.timing==='bmo'?'before the open on ':'on ';
  return '<span class="evwarn">'+S.ticker+' reports earnings '+(S.blind?'before this '+exLabel(exDays)+' contract expires (the date stays hidden on a blind day)':when+ev.date+', before this '+exLabel(exDays)+' contract expires')+
    '. Real options were priced for that move and cost far more than shown here; this model has no earnings premium.</span> ';

/** One line saying where the volatility in these prices came from. */
function volSource(){
  const m=volModel(S.cursor);

  const lvl=m.level.toFixed(2),pct=(m.atm*100).toFixed(1)+'%';
  const where=m.src==='minute'?m.index+' at '+lbl(HIST,S.cursor)+' was '+lvl:
    m.src==='open'?m.index+' opened the day at '+lvl+' (no minute record for this day)':
    m.index+' '+lvl+' from the last calibration (no record for this day)';

    S.ticker+' options trade at '+m.cal.ratio.toFixed(2)+'&times; '+m.index+' ('+(S.blind?'measured from real trades':m.cal.date===(S.replay&&S.replay.date)?'measured at this day&rsquo;s close':'measured '+m.cal.date+(m.cal.carried?', carried back to this earlier day':''))+')';

function strikes(under){
  const inc=cfg(S.ticker).inc;
  const atm=Math.round(under/inc)*inc;
  const out=[];for(let k=-5;k<=5;k++)out.push(+(atm+k*inc).toFixed(2));

/* ================= generation ================= */
function build(ticker,regime,vm,seed){
  const rng=mul32(seed);
  const g=()=>{let u=0,v=0;while(!u)u=rng();while(!v)v=rng();
    return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);};
  let reg=regime;
  if(reg==='random')reg=['trendup','trenddown','chop','fakeout','chop','trendup','trenddown','fakeout'][Math.floor(rng()*8)];
  const gcfg=TICKERS[ticker]||{px:100,v:.002,iv:.35,inc:1},mv=gcfg.v*vm/Math.sqrt(5);
  let price=gcfg.px*(1-.05+rng()*.10);
  const mins=[],dates=[];
  let d=new Date(2026,8,4),stack=[];
  for(let i=0;i<=HIST;i++){stack.push(new Date(d));do{d.setDate(d.getDate()-1);}while(d.getDay()===0||d.getDay()===6);}
  stack.reverse().forEach(x=>dates.push(x));
  for(let day=0;day<=HIST;day++){
    const today=day===HIST;
    const dayBias=g()*.35*mv;
    const flip=today&&reg==='fakeout'?Math.round(45+rng()*55):-1;
    let dir=reg==='trenddown'?-1:1;
    if(today&&reg==='fakeout')dir=rng()<.5?1:-1;
    price*=(1+g()*mv*4);
    const dayOpen=price;
    for(let m=0;m<MPD;m++){
      let bias=dayBias;const decay=Math.exp(-m/240);
      if(today){
        if(reg==='trendup')bias=mv*.34*decay;
        else if(reg==='trenddown')bias=-mv*.34*decay;
        else if(reg==='chop')bias=-Math.sign(price-dayOpen)*mv*.15;
        else if(reg==='fakeout')bias=(m<flip?dir:-dir)*mv*(m<flip?.28:.42)*decay;
      }
      const uv=mv*(1+1.7*Math.exp(-m/26)+.5*Math.exp(-(MPD-m)/34));
      const o=price;let c=o*(1+g()*uv+bias);
      const h=Math.max(o,c)+Math.abs(g())*uv*o*.5, l=Math.min(o,c)-Math.abs(g())*uv*o*.5;
      const v=Math.round((1+3.2*Math.exp(-m/24)+1.2*Math.exp(-(MPD-m)/30)+rng()*.8)*(gcfg.px>300?2.2e4:6e4));
      mins.push({o,h,l,c,v,day,m});price=c;
    }
  }
  return {mins,reg,dates};
}
/* Real recorded sessions, embedded at build time. Each entry is one measured

const REPLAY=window.MP_SESSIONS||[];

/**
 * A session's bars, from either form: plain [o,h,l,c,v] rows, or the compact
 * form practice.ts embeds -- whole cents from the previous close, in fives.
 */
function barsOf(r){
  if(r.bars)return r.bars;
  const out=[],z=r.z;let pc=r.p;
  for(let i=0;i<z.length;i+=5){
    const O=pc+z[i],H=O+z[i+1],L=O-z[i+2],C=O+z[i+3];
    out.push([O/100,H/100,L/100,C/100,z[i+4]]);pc=C;
  }
  // A history-only day comes in 5-minute bars. The engine counts a day as 390
  // minutes, so each is repeated five times: the 5m view and everything above
  // it is exact, and the 1m view of a day nobody trades is five flat bars.
  if(r.d===5){const m=[];for(const b of out)for(let k=0;k<5;k++)m.push([b[0],b[1],b[2],b[3],Math.round(b[4]/5)]);return m;}
  return out;
}
/** The days that can be traded: the newest twelve of each ticker. Older ones are history behind them. */
const PICK=(window.MP_SESSIONS||[]).filter(r=>!r.hist);
/**
 * A session's extended hours as bar objects, from the raw form ([m,o,h,l,c,v]
 * rows) or the compact one practice.ts embeds. Null where none were kept.

function extOf(r){
  const obj=rows=>rows.map(([m,o,h,l,c,v])=>({m,o,h,l,c,v}));
  if(r.ext)return {pre:obj(r.ext.pre||[]),post:obj(r.ext.post||[])};
  if(!r.x)return null;
  const dec=z=>{const out=[];let pc=null;
    for(let i=0;i<z.length;i+=6){const O=pc==null?z[i+1]:pc+z[i+1],H=O+z[i+2],L=O-z[i+3],C=O+z[i+4];
      out.push({m:z[i]*5,o:O/100,h:H/100,l:L/100,c:C/100,v:z[i+5]});pc=C;}
    return out;};
  return {pre:dec(r.x.pre||[]),post:dec(r.x.post||[])};
}
/** Turns embedded sessions into the minute array the engine expects. */
function fromReplay(pick){
  const sess=REPLAY.filter(r=>r.symbol===pick.symbol).sort((a,b)=>a.date.localeCompare(b.date));
  if(!sess.length)return null;
  // The chosen day is the one traded; everything before it is real history.
  let end=sess.findIndex(r=>r.date===pick.date);
  if(end<0)end=sess.length-1;
  const use=sess.slice(0,end+1);
  const mins=[],dates=[];
  use.forEach((r,day)=>{
    dates.push(new Date(r.date+'T12:00:00Z'));
    barsOf(r).forEach((b,m)=>mins.push({o:b[0],h:b[1],l:b[2],c:b[3],v:b[4],day,m}));
  });
  return {mins,dates,days:use.length,carried:use[use.length-1].carried,date:use[use.length-1].date,ext:use.map(extOf)};
}

/**
 * A random recorded session, optionally restricted to one symbol. Returns null
 * when nothing is embedded, which sends init() down the generator path.
 */
const MIN_HIST=2;
function randomReplay(symbol){
  const pool=symbol?PICK.filter(r=>r.symbol===symbol):PICK;
  if(!pool.length)return null;
  // A day with nothing recorded behind it has no context: the daily and 4H views
  // are empty, prior-session levels do not exist, and the chart opens on three
  // candles. Pick days that have history; if the library is too shallow for that,
  // take the deepest available rather than the shallowest.
  const depth=r=>REPLAY.filter(x=>x.symbol===r.symbol&&x.date<r.date).length;
  const deep=pool.filter(r=>depth(r)>=MIN_HIST);
  const best=Math.max.apply(null,pool.map(depth));
  const use=deep.length?deep:pool.filter(r=>depth(r)===best);
  const r=use[Math.floor(Math.random()*use.length)];
  return {symbol:r.symbol,date:r.date};
}

function init(ticker,regime,vm,seed,replayPick){

    pos:null,trades:[],draw:[],pend:null,log:[],autoTrim:false,

function log(t,c){S.log.push({t,c});if(S.tab==='tape')pane();}

/* ================= rewind ================= */
/**
 * Replay is only useful if you can go back and try the other decision, so the
 * whole mutable trading state is snapshotted before every step forward.
 *
 * Journal writes are deliberately NOT sent at the moment a position closes any
 * more. A trade you rewind past never happened, and there is no way to retract
 * a row once it has been posted -- so closed trades queue in pendingJournal and
 * are flushed at the closing bell, or when you ask for it.
 */
function snapshot(){
  S.hist.push(JSON.stringify({
    cursor:S.cursor,pos:S.pos,trades:S.trades,orders:S.orders,
    brk:S.brk,brkMin:S.brkMin,logN:S.log.length,pj:S.pendingJournal.length,pl:S.pendingLedger.length,peak:S.peakNet}));
  if(S.hist.length>420)S.hist.shift();
}
function stepBack(){
  if(!RULES.rewind){log('Rewind is off under your rules: what happened, happened. The Rules tab turns it back on.','y');return renderAll();}
  const raw=S.hist.pop();
  if(!raw){log('Nothing to rewind — you are at the start of the session.','y');return renderAll();}
  const h=JSON.parse(raw);
  S.cursor=h.cursor;S.pos=h.pos;S.trades=h.trades;S.orders=h.orders;
  S.brk=h.brk;S.brkMin=h.brkMin;
  S.log.length=h.logN;S.pendingJournal.length=h.pj;S.pendingLedger.length=h.pl||0;S.peakNet=h.peak||0;
  setRange();   // gone again if the rewind crossed back over 9:45

  S.cache={};S.afibK=null;
  if(S.view.right!=null)S.view.right=null;

/* ================= helpers ================= */
const todayStart=()=>HISTN*MPD;
const revealed=()=>todayStart()+S.cursor;
const price=()=>S.mins[revealed()-1].c;
function tfMin(){return TFS.find(t=>t.k===S.tf).m;}
function lbl(day,m){const h=Math.floor((570+m)/60),mm=(570+m)%60;
  const t=(h>12?h-12:h)+':'+String(mm).padStart(2,'0');
  if(day===HIST)return t;if(S.blind)return dayLbl(day)+' '+t;const d=S.dates[day];return (d.getMonth()+1)+'/'+d.getDate()+' '+t;}

/** A minute of the day as a clock time; extended-hours bars get an a or p, since 4:00 happens twice. */
function tlblAbs(t,ext){const h=Math.floor(t/60),mm=t%60;return (h>12?h-12:h)+':'+String(mm).padStart(2,'0')+(ext?(t<720?'a':'p'):'');}

function bars(){
  const key=S.tf+'|'+S.cursor+'|'+(S.ind.ext?1:0);
  if(S.cache.key===key)return S.cache.bars;
  const tm=tfMin(),out=[],end=revealed(),isD=tm==='D';
  const ext=!isD&&S.ind.ext&&S.ext&&S.ext.length;
  let cur=null;
  // Extended-hours bars of one segment of one day. They sit between two
  // regular minutes in the bar order, so each is given a fractional minute
  // index in the gap after the minute it follows: a mark or drawing keyed by a
  // whole minute still lands on a regular bar, and a drawing made on an
  // extended bar finds that bar again.

    if(!rows||!rows.length)return;
    const base=seg==='pre'?day*MPD-.5:(day+1)*MPD-1,start=seg==='pre'?240:960,n=rows.length,w=tm<5?5:tm;
    rows.forEach((b,j)=>{

      if(!cur||cur.key!==bucket)out.push(cur={key:bucket,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v,day,m:b.m,s,e:s,t:start+b.m,x:seg});
      else{cur.h=Math.max(cur.h,b.h);cur.l=Math.min(cur.l,b.l);cur.c=b.c;cur.v+=b.v;}
    });
  };

    const from=d*MPD,to=Math.min(end,from+MPD);
    for(let i=from;i<to;i++){

      if(!cur||cur.key!==bucket)out.push(cur={key:bucket,o:b.o,h:b.h,l:b.l,c:b.c,v:b.v,day:b.day,m:b.m,s:i,e:i+1,t:570+b.m});
      else{cur.h=Math.max(cur.h,b.h);cur.l=Math.min(cur.l,b.l);cur.c=b.c;cur.v+=b.v;cur.e=i+1;}
    }
    if(to<from+MPD)break;                       // today, still being revealed
    if(ext&&d<HISTN)addExt(S.ext[d]&&S.ext[d].post,d,'post');

}
function barIdxForMin(mi){const B=bars();let lo=0,hi=B.length-1,r=B.length-1;
  while(lo<=hi){const md=(lo+hi)>>1;if(B[md].s<=mi){r=md;lo=md+1;}else hi=md-1;}
  const b=B[r];return r+Math.min(1,Math.max(0,(mi-b.s)/Math.max(1,b.e-b.s)));}

/** The opening range and its levels, from the first 15 minutes. Only once they have all been seen. */
function setRange(){
  if(S.cursor<OR_MIN){S.or=null;S.fib=null;return;}
  const s=todayStart(),seg=S.mins.slice(s,s+OR_MIN);
  const hi=Math.max(...seg.map(b=>b.h)),lo=Math.min(...seg.map(b=>b.l)),r=hi-lo;
  S.or={hi,lo,r};
  const F={};LV.forEach(p=>F[(p*100).toFixed(1).replace('.0','')+'%']=lo+r*p);
  F['127.2%']=hi+r*.272;F['161.8%']=hi+r*.618;F['261.8%']=hi+r*1.618;
  F['-27.2%']=lo-r*.272;F['-61.8%']=lo-r*.618;F['-161.8%']=lo-r*1.618;

/* ================= auto fib ================= */
/*
 * The fib the chart draws by itself follows the last swing on it, the way a
 * ZigZag finds swings: a high is a pivot once price has come off it by more
 * than the threshold, a low once price has bounced that much. The levels run
 * from the last confirmed pivot to the extreme since -- so they extend live
 * as the leg runs -- or, before the leg has gone anywhere, across the leg
 * before it. Before the day has a swing at all it uses the day's range so
 * far, and before that yesterday's. It used to be the first fifteen minutes,
 * fixed for the day, which is one idea about a day and not the chart's.
 */
function autoFib(){
  const s=todayStart(),bs=S.mins.slice(s,revealed()),px=price();
  const ranges=bs.map(b=>b.h-b.l).sort((a,b)=>a-b),med=ranges.length?ranges[ranges.length>>1]:0;
  const thr=Math.max(px*.003,med*3);
  const piv=[];let dir=0,hi={i:0,p:-Infinity},lo={i:0,p:Infinity},A=null;
  bs.forEach((b,i)=>{
    if(b.h>hi.p)hi={i,p:b.h};if(b.l<lo.p)lo={i,p:b.l};
    if(dir>=0&&hi.p-b.l>=thr){piv.push({...hi,t:'H'});dir=-1;lo={i,p:b.l};hi={i,p:-Infinity};}
    else if(dir<=0&&b.h-lo.p>=thr){piv.push({...lo,t:'L'});dir=1;hi={i,p:b.h};lo={i,p:Infinity};}
  });

  if(last&&cur&&Math.abs(cur.p-last.p)>=thr/2){a=last;b=cur;}
  else if(piv.length>=2){a=piv[piv.length-2];b=last;}
  else if(bs.length>=5&&hi.p-lo.p>=thr/2&&isFinite(hi.p)&&isFinite(lo.p)){src='day';const H={...hi},L={...lo};a=H.i<L.i?H:L;b=H.i<L.i?L:H;}
  else if(bs.length>=5&&piv.length===1&&cur){a=last;b=cur;}
  else if(HISTN>0){src='prior';const pd=S.mins.slice(s-MPD,s);let H={i:-MPD,p:-Infinity},L={i:-MPD,p:Infinity};
    pd.forEach((x,i)=>{if(x.h>H.p)H={i:i-MPD,p:x.h};if(x.l<L.p)L={i:i-MPD,p:x.l};});a=H.i<L.i?H:L;b=H.i<L.i?L:H;}
  else return null;
  const r=b.p-a.p,up=r>0,lv={};
  LV.forEach(p=>lv[(p*100).toFixed(1).replace('.0','')+'%']=b.p-r*p);
  lv['127.2%']=b.p+r*.272;lv['161.8%']=b.p+r*.618;lv['261.8%']=b.p+r*1.618;
  return {a:{m:s+a.i,p:a.p},b:{m:s+b.i,p:b.p},up,lv,src,thr,live:src==='swing'&&b===cur};
}
/** The auto fib for the bars on screen, computed once per revealed minute. */
function getAutoFib(){
  const k=revealed();
  if(S.afibK!==k||S.afib===undefined){S.afib=autoFib();S.afibK=k;}
  return S.afib;
}

/* ================= engine ================= */
function stepMinutes(n){
  for(let k=0;k<n;k++){
    if(S.cursor>=MPD){settleExpiry();return false;}
    S.cursor++;
    const b=S.mins[todayStart()+S.cursor-1];
    if(S.cursor===OR_MIN&&!S.or){setRange();
      log('9:45 — opening range set: '+S.or.lo.toFixed(2)+' to '+S.or.hi.toFixed(2)+' ('+S.or.r.toFixed(2)+' wide). A 5-minute close outside it confirms a breakout.','hl');}
    if(!S.brk&&S.or&&S.cursor>OR_MIN&&S.cursor%5===0){
      const c=b.c;
      if(c>S.or.hi){S.brk='long';S.brkMin=S.cursor;
        log(lbl(HIST,S.cursor)+' — 5m close above range high at '+c.toFixed(2)+'. Upside breakout confirmed.','g');}
      else if(c<S.or.lo){S.brk='short';S.brkMin=S.cursor;
        log(lbl(HIST,S.cursor)+' — 5m close below range low at '+c.toFixed(2)+'. Downside breakout confirmed.','r');}
    }
    fillOrders(b,S.cursor);

  }
  S.cache={};
  if(S.cursor>=MPD)settleExpiry();
  return true;
}
function manage(b,cm){
  const p=S.pos;
  const bull=p.kind==='shares'?p.dir==='long':p.optType==='call';
  p.mfe=Math.max(p.mfe,bull?b.h-p.uEntry:p.uEntry-b.l);
  p.mae=Math.min(p.mae,bull?b.l-p.uEntry:p.uEntry-b.h);
  if(p.stopU!=null&&(bull?b.l<=p.stopU:b.h>=p.stopU)){exit(p.stopU,p.qty,cm,'stop');return;}
  if(S.autoTrim&&S.fib){
    (bull?['127.2%','161.8%']:['-27.2%','-61.8%']).forEach(k=>{
      if(!S.pos||p.hit[k])return;const lv=S.fib[k];
      if(bull?b.h>=lv:b.l<=lv){p.hit[k]=1;
        log(lbl(HIST,cm)+' — tagged '+k+', trimming a third.','y');
        exit(lv,Math.max(1,Math.round(p.qty/3)),cm,'trim@'+k);}
    });
  }
  if(S.pos&&p.targetU!=null&&(bull?b.h>=p.targetU:b.l<=p.targetU))exit(p.targetU,p.qty,cm,'target');
}
function settleExpiry(){
  if(!S.pos||S.pos.kind!=='option'||S.pos.exDays!==0)return;
  const u=price(),p=S.pos;
  const intr=p.optType==='call'?Math.max(0,u-p.strike):Math.max(0,p.strike-u);
  log('4:00 close — 0DTE contracts expire. Settling at intrinsic value '+intr.toFixed(2)+'.','y');
  exitPrem(intr,p.qty,MPD,'expiry');
}
/**
 * Opens or adds to a position.
 *
 * `fill` is supplied when a working order triggered rather than the user
 * pressing Long or Short. It carries the price the order filled at and the
 * size and brackets captured when the order was placed -- not whatever is in
 * the ticket boxes now, which may have been edited in the meantime.
 */
function enter(bull,fill){
  if(S.cursor>=MPD)return;
  const u=fill?fill.u:price();
  let stopU=fill?(fill.stopU==null?NaN:fill.stopU):parseFloat(val('stop'));
  const tgtU=fill?(fill.targetU==null?NaN:fill.targetU):parseFloat(val('tgt'));
  // A stop on the wrong side of the price closes the trade on the very next bar.
  // From the buttons, refuse and say why; from a working order that has already
  // filled, keep the fill and drop the stop rather than undo the trade.
  if(!isNaN(stopU)&&(bull?stopU>=u:stopU<=u)){
    const side=S.mode==='options'?(bull?'call':'put'):(bull?'long':'short');
    if(!fill){log('A stop at '+stopU.toFixed(2)+' is '+(bull?'above':'below')+' the price ('+u.toFixed(2)+'), so it would close a '+side+' straight away. Move it to the other side of the price, or clear it.','y');return pane();}
    log('Filled at '+u.toFixed(2)+', already past the stop at '+stopU.toFixed(2)+'. The stop was dropped rather than closing the trade on the spot.','y');
    stopU=NaN;
  }
  if(S.mode==='shares'){
    const dir=bull?'long':'short';
    const qty=fill?fill.qty:Math.max(1,parseInt(val('qty'))||100);
    if(S.pos&&S.pos.dir!==dir){log('Close the current position before flipping sides.','y');return pane();}
    if(S.pos){const p=S.pos,t=p.qty+qty;noteAdd(p,bull,qty);p.avg=(p.avg*p.qty+u*qty)/t;p.qty=t;p.openQty=(p.openQty||0)+qty;
      log(lbl(HIST,S.cursor)+' — added '+qty+' shares at '+u.toFixed(2)+', avg '+p.avg.toFixed(2)+'.',bull?'g':'r');}
    else{S.pos=mkPos({kind:'shares',dir,avg:u,entry:u,qty,openQty:qty,stopU:isNaN(stopU)?null:stopU,
      targetU:isNaN(tgtU)?null:tgtU,uEntry:u,...planOf(bull,qty,stopU,tgtU,u)});
      log(lbl(HIST,S.cursor)+' — '+dir+' '+qty+' shares at '+u.toFixed(2)+
        (isNaN(stopU)?', no stop':', stop '+stopU.toFixed(2))+'.',bull?'g':'r');}
  }else{
    const type=bull?'call':'put';
    const qty=fill?fill.qty:Math.max(1,parseInt(val('qty'))||1);
    const K=S.strike,ex=S.exDays;
    if(S.pos&&(S.pos.optType!==type||S.pos.strike!==K||S.pos.exDays!==ex)){
      log('Close the open contract before opening a different one.','y');return pane();}
    const q=quote(K,type,ex,u);
    if(S.pos){const p=S.pos,t=p.qty+qty;noteAdd(p,bull,qty);p.avgPrem=(p.avgPrem*p.qty+q.ask*qty)/t;p.qty=t;p.openQty=(p.openQty||0)+qty;
      log(lbl(HIST,S.cursor)+' — added '+qty+' '+K+type[0].toUpperCase()+' at '+q.ask.toFixed(2)+
        ', avg '+p.avgPrem.toFixed(2)+'.',bull?'g':'r');}
    else{
      S.pos=mkPos({kind:'option',optType:type,strike:K,exDays:ex,qty,openQty:qty,
        avgPrem:q.ask,entryPrem:q.ask,entryIV:q.iv,entryDelta:q.delta,entryTheta:q.thetaHr,
        uEntry:u,stopU:isNaN(stopU)?null:stopU,targetU:isNaN(tgtU)?null:tgtU,...planOf(bull,qty,stopU,tgtU,u)});
      log(lbl(HIST,S.cursor)+' — bought '+qty+'x '+K+' '+type+' ('+exLabel(ex)+') at '+q.ask.toFixed(2)+
        ' with '+S.ticker+' at '+u.toFixed(2)+'. Delta '+q.delta.toFixed(2)+'.',bull?'g':'r');
      if(!S.brk)log('Heads up: no 5m bar has closed outside the range yet.','y');
    }
  }
  renderAll();
}
/* ================= working orders ================= */
/**
 * Resting orders, checked once per minute bar.
 *
 * A limit fills at its own price -- price had to reach it for the order to
 * trigger at all. A stop is filled at the worse of its price and the bar open,
 * because a market that gaps through a stop does not fill you at the stop; that
 * gap is the whole reason stops disappoint people, and a simulator that hides
 * it teaches the wrong lesson.
 */
function fillOrders(b,cm){
  if(!S.orders.length)return;
  const keep=[];
  for(const o of S.orders){
    const hit=o.kind==='limit'
      ?(o.bull?b.l<=o.px:b.h>=o.px)
      :(o.bull?b.h>=o.px:b.l<=o.px);
    if(!hit){keep.push(o);continue;}
    const px=o.kind==='limit'?o.px:(o.bull?Math.max(o.px,b.o):Math.min(o.px,b.o));
    const slip=o.kind==='stop'&&Math.abs(px-o.px)>0.004;
    log(lbl(HIST,cm)+' — '+o.kind+' '+(o.bull?'buy':'sell')+' triggered at '+px.toFixed(2)+
      (slip?' (gapped through '+o.px.toFixed(2)+')':''),slip?'y':'hl');
    enter(o.bull,{u:px,qty:o.qty,stopU:o.stopU,targetU:o.targetU});
  }
  S.orders=keep;
}
function placeOrder(bull){
  const px=parseFloat(val('olim'));
  if(isNaN(px)){log('Give the order a price first.','y');return;}
  const u=price();
  // A buy limit above the market (or a buy stop below it) would fill instantly
  // on the next bar, which means the user picked the wrong order type.
  const wrong=S.oType==='limit'?(bull?px>u:px<u):(bull?px<u:px>u);
  if(wrong){
    log('A '+(bull?'buy':'sell')+' '+S.oType+' at '+px.toFixed(2)+' is already through the market at '
      +u.toFixed(2)+'. Use the other order type, or trade at market.','y');return;
  }
  const stopU=parseFloat(val('stop')),tgtU=parseFloat(val('tgt'));
  S.orders.push({id:Date.now()+Math.random(),kind:S.oType,bull,px,
    qty:Math.max(1,parseInt(val('qty'))||(S.mode==='shares'?100:1)),
    stopU:isNaN(stopU)?null:stopU,targetU:isNaN(tgtU)?null:tgtU,placedMin:S.cursor});
  log(lbl(HIST,S.cursor)+' — '+S.oType+' '+(bull?'buy':'sell')+' resting at '+px.toFixed(2)+'.','hl');
  renderAll();
}
function cancelOrder(id){S.orders=S.orders.filter(o=>String(o.id)!==String(id));
  log('Order cancelled.','y');renderAll();}

function mkPos(o){return {realized:0,hit:{},mfe:0,mae:0,exits:[],entryMin:S.cursor,tfUsed:S.tf,
  afterBrk:!!S.brk,brkDir:S.brk,lagBars:S.brkMin==null?null:Math.round((S.cursor-S.brkMin)/5),...o};}
function exLabel(d){return d===0?'0DTE':d===1?'1DTE':d+'DTE';}

function exit(underPx,qty,cm,why){
  const p=S.pos;if(!p)return;
  if(p.kind==='shares'){
    qty=Math.min(qty,p.qty);
    const per=p.dir==='long'?underPx-p.avg:p.avg-underPx,pnl=per*qty;
    finish(pnl,underPx,qty,cm,why);
  }else{
    const q=quote(p.strike,p.optType,p.exDays,underPx);
    exitPrem(q.bid,qty,cm,why,underPx);
  }
}
function exitPrem(prem,qty,cm,why,underPx){
  const p=S.pos;if(!p)return;
  qty=Math.min(qty,p.qty);
  const pnl=(prem-p.avgPrem)*100*qty;
  finish(pnl,prem,qty,cm,why,underPx);
}
/**
 * Sends a closed practice trade to the journal.
 *
 * Flagged as practice so it is stored beside real trades but excluded from
 * every real statistic. Best effort: with no server behind the page it is
 * buffered locally instead of lost, and the journal page drains the buffer.
 */
/** Session date plus a minute offset from the 9:30 open, as a local stamp. */
function stampAt(min){
  const d=S.replay?S.replay.date:new Date().toISOString().slice(0,10);
  const t=9*60+30+Math.max(0,Math.round(min||0));
  const p2=v=>String(v).padStart(2,"0");
  return d+"T"+p2(Math.floor(t/60))+":"+p2(t%60)+":00";
}
function logToJournal(p, exitPrice, pnl, closeMin){
  try{
    const t={
      source:'practice',practice:true,
      symbol:S.ticker,
      side:p.kind==='option'?(p.optType==='call'?'long':'short'):p.dir,
      instrument:p.kind==='option'?'option':'shares',
      option:p.kind==='option'?{expiry:String(p.exDays)+'DTE',strike:p.strike,type:p.optType}:undefined,
      // closedQty, not qty: finish() has decremented qty to zero by the time
      // the round trip completes. exitPrice arrives size-weighted across every
      // scale-out, and the entry is the average paid, so qty x (exit - entry)
      // reproduces the realized P&L exactly however the trade was scaled.
      qty:p.closedQty||p.openQty||1,
      entryPrice:p.kind==="option"?p.avgPrem:p.avg,
      entryTime:stampAt(p.entryMin),
      exitPrice:exitPrice,exitTime:stampAt(closeMin),
      // The planned stop is an underlying price. For shares that shares units
      // with the entry and gives a valid R; for an option the entry is a
      // premium, so recording it would produce a confidently wrong R. Left null.
      plannedStop:p.kind==="option"?null:(p.stopU??null),
      plannedTarget:p.kind==="option"?null:(p.targetU??null),
      fees:p.fees||0,setup:p.setup||null,mistakes:journalMistakes(p.flags||[]),rating:null,
      notes:'Practice replay'+(S.replay?' — '+S.ticker+' '+S.replay.date:'')
    };
    // Queued, not posted. See snapshot() -- a rewind must be able to unmake a
    // trade, and a posted row cannot be unmade.
    S.pendingJournal.push(t);
  }catch(e){}
}
/**
 * Sends every queued trade to the journal, or buffers it when no server is
 * listening -- which is the normal case on the hosted site, where the page is
 * static. The journal page reads that buffer back.
 */
function flushJournal(reason){
  const q=S.pendingJournal.splice(0);
  if(!q.length){log('No closed practice trades to send yet.','y');return;}
  let posted=0,buffered=0;
  Promise.all(q.map(t=>
    fetch('/journal/add',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(t)})
      .then(r=>{if(!r.ok)throw 0;posted++;})
      .catch(()=>{buffered++;bufferTrade(t);})
  )).then(()=>{
    log(q.length+' trade(s) sent to the journal'+(buffered?' ('+buffered+' saved in this browser -- open the Journal page to take them in)':'')+'.','hl');
    renderAll();
  });
}
function bufferTrade(t){
  try{
    const k='mpPendingTrades';
    const cur=JSON.parse(localStorage.getItem(k)||'[]');
    cur.push(t);localStorage.setItem(k,JSON.stringify(cur.slice(-500)));
  }catch(e){}
}

function finish(pnl,px,qty,cm,why,underPx){
  const p=S.pos;
  // The broker's cut, both ways, on the contracts leaving now. The entry side
  // is charged here too, so a trade scaled out in clips pays exactly once per
  // contract each way, and a trade that is rewound never paid at all.
  const fee=p.kind==='option'?+(RULES.fee*qty*2).toFixed(2):0;
  pnl-=fee;p.fees=+((p.fees||0)+fee).toFixed(2);
  p.realized+=pnl;p.qty-=qty;
  // Every clip that leaves the position is accumulated here. A trade scaled out
  // in three pieces is still one round trip, and it has one honest exit price:
  // the size-weighted average of those clips. Recording only the last one and
  // applying it to the full size -- which is what this used to do -- reports a
  // P&L that does not reconcile with the realized total.
  p.closedQty=(p.closedQty||0)+qty;
  p.exitNotional=(p.exitNotional||0)+px*qty;
  p.exits.push({px,qty,m:cm,why,pnl,under:underPx??price()});
  const unit=p.kind==='option'?' @ '+px.toFixed(2)+' premium':' at '+px.toFixed(2);
  log(lbl(HIST,cm)+' — '+(why==='stop'?'stopped out of ':why==='expiry'?'expired ':'closed ')+qty+
    (p.kind==='option'?' contract(s)':' shares')+unit+' ('+sgn(pnl)+(fee?' after '+usd(fee)+' in fees':'')+')',pnl>=0?'g':'r');
  if(p.qty<=0){
    const risk=riskOf(p);
    const rec=tradeRecord(p,cm,risk);
    S.trades.push({...p,total:p.realized,R:risk?p.realized/risk:null,closeMin:cm,flags:rec.flags,score:rec.score});
    S.pendingLedger.push(rec);
    S.peakNet=Math.max(S.peakNet||0,S.trades.reduce((a,t)=>a+t.total,0));
    if(rec.flags.length)log('Against your rules on this trade: '+rec.flags.map(f=>FLAGS[f]?FLAGS[f][0].toLowerCase():f).join(', ')+'. Discipline '+rec.score+'/100.','y');
    // The round trip is complete, so the journal gets it now rather than on a
    // later screen the user might never open.
    logToJournal(p,p.exitNotional/p.closedQty,p.realized,cm);
    const paid=p.kind==='option'?p.avgPrem*100*(p.openQty||1):p.avg*(p.openQty||1);
    log('Trade closed — net '+sgn(p.realized)+(paid>0?' · '+(p.realized>=0?'+':'−')+Math.abs(p.realized/paid*100).toFixed(1)+'% on '+(p.kind==='option'?'the premium paid':'the position'):'')+
      (risk?' ('+(p.realized/risk).toFixed(2)+'R)':''),'hl');
    S.pos=null;
  }
  renderAll();
}
function riskOf(p){
  if(p.stopU==null)return null;
  if(p.kind==='shares')return Math.abs(p.uEntry-p.stopU)*p.openQty;
  const q=quote(p.strike,p.optType,p.exDays,p.stopU);
  return Math.max(.01,(p.entryPrem-q.bid)*100*p.openQty);
}
function trim(f){if(!S.pos)return;exit(price(),Math.max(1,Math.round(S.pos.qty*f)),S.cursor,'manual');}

/* ================= canvas ================= */
const cv=$('cv'),cx=cv.getContext('2d');
let G={};
function resize(){
  const w=cv.parentElement.clientWidth;
  const desktop=window.innerWidth>=900;
  // On a phone the height is fixed once per width. Safari's address bar
  // collapses and expands as you scroll, which changes innerHeight and fired
  // a resize on every gesture -- the chart changed height under your fingers
  // and the whole page shifted. Only a change of width (a rotation) resizes it.
  let h;
  if(desktop)h=Math.round(Math.min(540,w*.5));
  else if(G.hFor===w&&G.h)h=G.h;
  else h=Math.round(Math.min(window.innerHeight*.46,430));
  G.hFor=w;
  const dpr=window.devicePixelRatio||1;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.height=h+'px';
  cx.setTransform(dpr,0,0,dpr,0,0);
  G.w=w;G.h=h;draw();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,220));

/* ============ chart text ============ */
// TradingView draws its axes in the system UI face at about 12px, in a light
// grey. This chart used 10px monospace in a mid grey (#5a6472), which was the
// hardest thing on the page to read, and worst on a phone. The system face is
// also always there offline, with no font load to wait for before drawing.
const CFAM='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
const AXIS='#b4bdca';
function fs(){return G.w<600?13:12;}
function cfont(px,wt){return (wt||500)+' '+px+'px '+CFAM;}
/** Round price steps (0.25, 0.5, 1, 2.5 ...) rather than five arbitrary splits. */
function niceStep(raw){
  const p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;
  return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;
}

function scale(){
  const B=bars();if(!B.length)return null;
  const F=fs();
  // Bottom padding holds the time labels, so it grows with the type.
  const padL=6,padT=8,padB=F+12;
  const volH=S.ind.vol?Math.round(G.h*.15):0;
  const rsiH=S.ind.rsi?Math.round(G.h*.17):0;
  const ph=G.h-padT-padB-volH-(volH?5:0)-rsiH-(rsiH?5:0);
  let right=S.view.right==null?B.length-1:Math.min(S.view.right,B.length-1);
  const count=Math.max(10,Math.min(S.view.count,B.length));
  const left=Math.max(0,right-count+1);
  const vis=B.slice(left,right+1);if(!vis.length)return null;
  let lo,hi;
  if(S.yMan){lo=S.yMan.lo;hi=S.yMan.hi;}
  else{
    lo=Math.min(...vis.map(b=>b.l));hi=Math.max(...vis.map(b=>b.h));
    const todayVis=vis.some(b=>b.day===HISTN);
    if(S.ind.or&&S.or&&todayVis){lo=Math.min(lo,S.or.lo);hi=Math.max(hi,S.or.hi);}
    if(S.pos)[S.pos.stopU,S.pos.targetU].forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v);}});
    const pd=(hi-lo)*.07||1;lo-=pd;hi+=pd;
  }
  // The price axis is as wide as its widest label rather than a fixed 64px:
  // larger type needs a wider axis, and a guess that is too small clips digits.
  cx.font=cfont(F,500);
  const padR=Math.max(50,Math.ceil(Math.max(cx.measureText(hi.toFixed(2)).width,cx.measureText(lo.toFixed(2)).width))+18);
  // RGAP keeps empty chart between the newest candle and the axis. Its only job
  // is to clear the auto-fib labels, which are right-aligned to the axis; with
  // those off, the candles get the room instead.
  cx.font=cfont(F-1,600);
  const RGAP=S.ind.fib?Math.ceil(cx.measureText('-161.8%').width)+18:16;
  const cw=(G.w-padL-padR-RGAP)/count;
  G={...G,padL,padR,padT,padB,volH,rsiH,ph,lo,hi,cw,left,right,count,B,RGAP,
    x:i=>padL+(i-left+.5)*cw,
    y:p=>padT+ph*(1-(p-lo)/(hi-lo)),
    ix:x=>left+(x-padL)/cw-.5,
    yp:y=>lo+(hi-lo)*(1-(y-padT)/ph)};
  return G;
}
function ln(x1,y1,x2,y2,c,w,d){cx.save();cx.strokeStyle=c;cx.lineWidth=w||1;if(d)cx.setLineDash(d);
  cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();cx.restore();}
function tag(t,x,y,c,bg){const F=fs();cx.save();cx.font=cfont(F-1,600);
  const w=cx.measureText(t).width+10,hh=F+6;
  cx.fillStyle=bg||'rgba(8,11,16,.9)';cx.fillRect(x,y-hh/2,w,hh);
  cx.fillStyle=c;cx.textBaseline='middle';cx.fillText(t,x+5,y+.5);cx.restore();return w;}

function draw(){
  if(!S.mins||!scale())return;
  const {w,h,padL,padR,padT,ph,volH,rsiH,cw,B,left,right}=G;
  cx.clearRect(0,0,w,h);cx.fillStyle='#0a0e14';cx.fillRect(0,0,w,h);
  const F=fs();
  // Price grid on round steps, spaced so the labels never crowd each other.
  cx.save();cx.font=cfont(F,500);cx.textBaseline='middle';cx.fillStyle=AXIS;
  {const step=niceStep((G.hi-G.lo)/Math.max(2,Math.floor(ph/(F*2.8))));
   // The last-price tag is drawn over the axis later; a grid label under it
   // would show through as a second number jammed against the first.
   const lb=B[B.length-1],lastY=lb&&B.length-1<=right?G.y(lb.c):null;
   for(let v=Math.ceil(G.lo/step)*step;v<=G.hi+1e-9;v+=step){
     const p=Math.round(v/step)*step,y=G.y(p);
     if(y<padT+F/2||y>padT+ph-F/2)continue;
     ln(padL,y,w-padR,y,'#141b24',1);
     if(lastY!=null&&Math.abs(y-lastY)<F+4)continue;
     cx.fillText(p.toFixed(2),w-padR+7,y);}}
  cx.restore();
  // axis affordances
  ln(w-padR+.5,padT,w-padR+.5,padT+ph,'#1c2430',1);
  ln(padL,padT+ph+volH+(volH?5:0)+G.rsiH+(G.rsiH?5:0)+.5,w-padR,padT+ph+volH+(volH?5:0)+G.rsiH+(G.rsiH?5:0)+.5,'#1c2430',1);
  // day breaks + time labels
  let prevDay=null;
  for(let i=left;i<=right;i++){const b=B[i];
    if(prevDay!==null&&b.day!==prevDay)ln(G.x(i)-cw/2,padT,G.x(i)-cw/2,padT+ph,'#222d3a',1);
    prevDay=b.day;}
  // Time axis, TradingView style: labels are anchored to absolute bars so they
  // do not jitter while you pan, spaced by their measured width so they cannot
  // overlap, and the date is shown where a new day starts rather than stuck on
  // the front of every label.
  cx.save();cx.font=cfont(F-1,500);cx.fillStyle=AXIS;cx.textAlign='center';
  {const slot=cx.measureText('12:00').width+26,every=Math.max(1,Math.ceil(slot/cw));
   const isD=tfMin()==='D',cand=[];
   for(let i=left;i<=right;i++){const b=B[i];
     const newDay=!isD&&i>0&&B[i-1].day!==b.day;
     if(newDay||i%every===0)cand.push({i,newDay,t:isD||newDay?dayLbl(b.day):tlblAbs(b.t,!!b.x)});}
   // Dates first. Drawn left to right, an earlier time label could take the
   // space and knock out the date of the day you are actually trading.
   cand.sort((a,b)=>b.newDay-a.newDay);
   const taken=[];
   for(const c of cand){
     cx.font=cfont(F-1,c.newDay?700:500);
     const X=G.x(c.i),tw=cx.measureText(c.t).width,l=X-tw/2,r=X+tw/2;
     if(l<padL||r>w-padR)continue;
     if(taken.some(q=>l<q[1]+10&&r>q[0]-10))continue;
     taken.push([l,r]);
     cx.fillStyle=c.newDay?'#e9edf5':AXIS;cx.fillText(c.t,X,h-8);}}
  cx.restore();

  // Extended hours are tinted, the way TradingView does it, so 4:00 in the
  // morning is not mistaken for 4:00 in the afternoon.
  if(S.ind.ext){cx.save();cx.fillStyle='rgba(123,108,246,.07)';
    for(let i=left;i<=right;i++)if(B[i].x)cx.fillRect(G.x(i)-cw/2,padT,cw,ph);
    cx.restore();}
  const todayVis=B.slice(left,right+1).some(b=>b.day===HISTN);
  if(S.ind.or&&S.or&&todayVis){
    cx.save();cx.fillStyle='rgba(109,156,245,.06)';
    cx.fillRect(padL,G.y(S.or.hi),w-padL-padR,G.y(S.or.lo)-G.y(S.or.hi));cx.restore();
    ln(padL,G.y(S.or.hi),w-padR,G.y(S.or.hi),'rgba(109,156,245,.7)',1.2);
    ln(padL,G.y(S.or.lo),w-padR,G.y(S.or.lo),'rgba(109,156,245,.7)',1.2);
  }
  // The levels a day is traded against: yesterday's high, low and close, and
  // the open. Drawn only when they are in view, so a stretched scale does not
  // pull the chart flat to fit a level a dollar away.
  if(S.ind.lvl&&todayVis){
    const s0=todayStart(),L=[['open',S.mins[s0].o,'#9aa4b4']];
    if(HISTN>0){
      const pd=S.mins.slice(s0-MPD,s0);
      let ph_=-Infinity,pl_=Infinity;for(const b of pd){if(b.h>ph_)ph_=b.h;if(b.l<pl_)pl_=b.l;}
      L.push(['PDH',ph_,'#f5a524'],['PDL',pl_,'#f5a524'],['PDC',pd[pd.length-1].c,'#9aa4b4']);
    }
    // The pre-market high and low: what the open is measured against.
    const pre=S.ext&&S.ext[HISTN]&&S.ext[HISTN].pre;
    if(pre&&pre.length){
      let h=-Infinity,l=Infinity;for(const b of pre){if(b.h>h)h=b.h;if(b.l<l)l=b.l;}
      L.push(['PMH',h,'#a99cf7'],['PML',l,'#a99cf7']);
    }
    L.forEach(([k,v,c])=>{
      const y=G.y(v);if(y<padT+4||y>padT+ph-4)return;
      ln(padL,y,w-padR,y,c,1,[2,4]);tag(k+' '+v.toFixed(2),padL+2,y-1,c);});
  }
  // auto fib: the last swing's levels, labelled in the axis gutter, with the
  // swing itself drawn faintly from its start to its end
  const AF=S.ind.fib&&todayVis?getAutoFib():null;
  if(AF){
    const prio=['0%','100%','161.8%','127.2%','50%','61.8%','38.2%','261.8%','78.6%','23.6%'];
    const x0=G.x(barIdxForMin(AF.a.m)),x1=G.x(barIdxForMin(AF.b.m));
    ln(x0,G.y(AF.a.p),x1,G.y(AF.b.p),'rgba(180,143,173,.45)',1.2,[4,3]);
    [[x0,AF.a.p],[x1,AF.b.p]].forEach(([X,p])=>{cx.beginPath();cx.arc(X,G.y(p),3,0,6.284);cx.fillStyle='#b48ead';cx.fill();});
    const placed=[];
    prio.forEach(k=>{
      const v=AF.lv[k];if(v==null)return;
      const y=G.y(v);if(y<padT+6||y>padT+ph-4)return;
      const isExt=k.includes('127')||k.includes('161')||k.includes('261');
      const edge=k==='0%'||k==='100%';
      ln(Math.max(padL,Math.min(x0,x1)),y,w-padR,y,edge?'rgba(180,143,173,.55)':isExt?'rgba(201,162,39,.45)':'rgba(120,130,150,.42)',1,isExt?[2,3]:edge?[]:[4,4]);
      if(placed.some(p=>Math.abs(p-y)<F+6))return;
      placed.push(y);
      cx.save();cx.font=cfont(F-1,600);cx.textBaseline='middle';
      const t=k;const tw=cx.measureText(t).width+10;
      cx.fillStyle='rgba(10,14,20,.92)';cx.fillRect(w-padR-tw-2,y-(F+6)/2,tw,F+6);
      cx.fillStyle=edge?'#c9a6c3':isExt?'#e0b73a':'#aab3c0';
      cx.fillText(t,w-padR-tw+3,y+.5);cx.restore();
    });
  }
  const series=(a,col)=>{cx.save();cx.strokeStyle=col;cx.lineWidth=1.3;cx.beginPath();let on=false;
    for(let i=Math.max(0,left-1);i<=right;i++){const X=G.x(i),Y=G.y(a[i]);on?cx.lineTo(X,Y):(cx.moveTo(X,Y),on=true);}
    cx.stroke();cx.restore();};
  if(S.ind.vwap){let pv=0,vv=0;series(B.map(b=>{const tp=(b.h+b.l+b.c)/3;pv+=tp*b.v;vv+=b.v;return pv/vv;}),'#b48ead');}
  if(S.ind.ema9){const k=2/10;let e=null;series(B.map(b=>e=e===null?b.c:b.c*k+e*(1-k)),'#88c0d0');}
  if(S.ind.ema20){const k=2/21;let e=null;series(B.map(b=>e=e===null?b.c:b.c*k+e*(1-k)),'#ebcb8b');}
  if(S.ind.ema50){const k=2/51;let e=null;series(B.map(b=>e=e===null?b.c:b.c*k+e*(1-k)),'#a3be8c');}
  if(S.ind.bb){
    const N=20,mid=[],up=[],dn=[];
    for(let i=0;i<B.length;i++){
      const a=B.slice(Math.max(0,i-N+1),i+1).map(b=>b.c);
      const m=a.reduce((x,y)=>x+y,0)/a.length;
      const sd=Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length);
      mid.push(m);up.push(m+2*sd);dn.push(m-2*sd);
    }
    cx.save();cx.fillStyle='rgba(136,192,208,.06)';cx.beginPath();
    for(let i=Math.max(0,left-1);i<=right;i++){const X=G.x(i),Y=G.y(up[i]);i===Math.max(0,left-1)?cx.moveTo(X,Y):cx.lineTo(X,Y);}
    for(let i=right;i>=Math.max(0,left-1);i--)cx.lineTo(G.x(i),G.y(dn[i]));
    cx.closePath();cx.fill();cx.restore();
    series(up,'rgba(136,192,208,.55)');series(dn,'rgba(136,192,208,.55)');series(mid,'rgba(136,192,208,.30)');
  }

  const bw=Math.max(cw*.66,1.2),CT=S.ctype;
  if(CT==='line'||CT==='area'){
    cx.save();cx.strokeStyle='#6d9cf5';cx.lineWidth=1.7;cx.beginPath();
    for(let i=left;i<=right;i++){const X=G.x(i),Y=G.y(B[i].c);i===left?cx.moveTo(X,Y):cx.lineTo(X,Y);}
    cx.stroke();
    if(CT==='area'){
      const g=cx.createLinearGradient(0,padT,0,padT+ph);
      g.addColorStop(0,'rgba(109,156,245,.30)');g.addColorStop(1,'rgba(109,156,245,0)');
      cx.lineTo(G.x(right),padT+ph);cx.lineTo(G.x(left),padT+ph);cx.closePath();
      cx.fillStyle=g;cx.fill();
    }
    cx.restore();
  }else{
    // Heikin Ashi has to be built from the first bar forward: each candle
    // depends on the one before it, so it cannot be computed for the visible
    // slice alone without drifting from what the full series would show.
    let ha=null;
    if(CT==='heikin'){
      ha=[];let po=null,pc=null;
      for(const b of B){
        const c=(b.o+b.h+b.l+b.c)/4;
        const o=po===null?(b.o+b.c)/2:(po+pc)/2;
        ha.push({o,c,h:Math.max(b.h,o,c),l:Math.min(b.l,o,c)});
        po=o;pc=c;
      }
    }
    for(let i=left;i<=right;i++){
      const b=ha?ha[i]:B[i],X=G.x(i),u=b.c>=b.o,col=u?'#26a37a':'#e0524a';
      const yt=G.y(Math.max(b.o,b.c)),yb=G.y(Math.min(b.o,b.c));
      if(CT==='bar'){
        ln(X,G.y(b.h),X,G.y(b.l),col,Math.max(1,cw*.14));
        ln(X-bw/2,G.y(b.o),X,G.y(b.o),col,Math.max(1,cw*.14));
        ln(X,G.y(b.c),X+bw/2,G.y(b.c),col,Math.max(1,cw*.14));
      }else{
        ln(X,G.y(b.h),X,G.y(b.l),col,Math.max(1,cw*.12));
        if(CT==='hollow'&&u){cx.save();cx.strokeStyle=col;cx.lineWidth=1.3;
          cx.strokeRect(X-bw/2+.5,yt+.5,Math.max(bw-1,1),Math.max(yb-yt-1,1));cx.restore();}
        else{cx.fillStyle=col;cx.fillRect(X-bw/2,yt,bw,Math.max(yb-yt,1));}
      }
    }
  }
  if(volH){const vt=padT+ph+5,mx=Math.max(...B.slice(left,right+1).map(b=>b.v));
    for(let i=left;i<=right;i++){const b=B[i],bh=(b.v/mx)*volH;
      cx.fillStyle=b.c>=b.o?'rgba(38,163,122,.36)':'rgba(224,82,74,.36)';
      cx.fillRect(G.x(i)-bw/2,vt+volH-bh,bw,bh);}}
  if(rsiH){
    // Wilder smoothing, seeded on the first 14 bars.
    const NP=14,cl=B.map(b=>b.c),rs=new Array(B.length).fill(null);
    let ag=0,al=0;
    for(let i=1;i<B.length;i++){
      const d=cl[i]-cl[i-1],g=Math.max(0,d),l=Math.max(0,-d);
      if(i<=NP){ag+=g/NP;al+=l/NP;}
      else{ag=(ag*(NP-1)+g)/NP;al=(al*(NP-1)+l)/NP;}
      if(i>=NP)rs[i]=al===0?100:100-100/(1+ag/al);
    }
    const rt=padT+ph+volH+(volH?5:0)+5, ry=v=>rt+rsiH*(1-v/100);
    cx.save();cx.fillStyle='rgba(109,156,245,.05)';
    cx.fillRect(padL,ry(70),w-padL-padR,ry(30)-ry(70));cx.restore();
    [30,70].forEach(v=>ln(padL,ry(v),w-padR,ry(v),'#222d3a',1,[3,3]));
    cx.save();cx.strokeStyle='#b48ead';cx.lineWidth=1.3;cx.beginPath();let on=false;
    for(let i=Math.max(0,left-1);i<=right;i++){
      if(rs[i]==null)continue;const X=G.x(i),Y=ry(rs[i]);
      on?cx.lineTo(X,Y):(cx.moveTo(X,Y),on=true);}
    cx.stroke();cx.restore();
    const lastR=rs[right];
    cx.fillStyle=AXIS;cx.font=cfont(F-2,600);
    cx.fillText('RSI 14'+(lastR==null?'':'  '+lastR.toFixed(1)),padL+4,rt+F);
  }

  S.orders.forEach(o=>{
    const Y=G.y(o.px);if(Y<padT||Y>padT+ph)return;
    ln(padL,Y,w-padR,Y,o.bull?'rgba(38,163,122,.75)':'rgba(224,82,74,.75)',1,[6,4]);
    tag(o.kind+' '+(o.bull?'buy':'sell')+' '+o.qty,padL+2,Y-1,o.bull?'#26a37a':'#e0524a');
  });
  if(S.pos){const p=S.pos;
    if(p.stopU!=null){ln(padL,G.y(p.stopU),w-padR,G.y(p.stopU),'#e0524a',1,[3,3]);
      tag('stop '+p.stopU.toFixed(2),padL+2,G.y(p.stopU)-1,'#e0524a');}
    if(p.targetU!=null){ln(padL,G.y(p.targetU),w-padR,G.y(p.targetU),'#26a37a',1,[3,3]);
      tag('tgt '+p.targetU.toFixed(2),padL+2,G.y(p.targetU)-1,'#26a37a');}
    if(p.kind==='option'){ln(padL,G.y(p.strike),w-padR,G.y(p.strike),'rgba(180,143,173,.8)',1,[5,4]);
      tag(p.strike+(p.optType==='call'?'C':'P'),padL+2,G.y(p.strike)-1,'#b48ead');}
    mark(todayStart()+p.entryMin-1,p.uEntry,'#dfe6ef',true);}
  S.trades.forEach(t=>{mark(todayStart()+t.entryMin-1,t.uEntry,t.total>=0?'#26a37a':'#e0524a',false);
    t.exits.forEach(e=>{const bi=barIdxForMin(todayStart()+e.m-1);if(bi<left-1||bi>right+1)return;
      const X=G.x(bi),Y=G.y(e.under);cx.strokeStyle=e.pnl>=0?'#26a37a':'#e0524a';cx.lineWidth=1.3;
      cx.beginPath();cx.moveTo(X-3.5,Y-3.5);cx.lineTo(X+3.5,Y+3.5);cx.moveTo(X+3.5,Y-3.5);cx.lineTo(X-3.5,Y+3.5);cx.stroke();});});
  function mark(mi,p,col,fill){const bi=barIdxForMin(mi);if(bi<left-1||bi>right+1)return;
    const X=G.x(bi),Y=G.y(p);cx.beginPath();cx.arc(X,Y,4,0,6.284);
    if(fill){cx.fillStyle=col;cx.fill();}else{cx.strokeStyle=col;cx.lineWidth=1.4;cx.stroke();}}

  S.draw.forEach(d=>shape(d,0));if(S.pend)shape(S.pend,1);

  if(S.hover&&S.hover.in){const{mx,my}=S.hover;
    ln(mx,padT,mx,padT+ph,'rgba(223,230,239,.24)',1,[3,3]);
    ln(padL,my,w-padR,my,'rgba(223,230,239,.24)',1,[3,3]);
    tag(G.yp(my).toFixed(2),w-padR+1,my,'#06090f','#6d9cf5');}
  const last=B[B.length-1];
  if(last&&B.length-1<=right){const y=G.y(last.c);
    if(y>padT&&y<padT+ph)tag(last.c.toFixed(2),w-padR+1,y,'#06090f',last.c>=last.o?'#26a37a':'#e0524a');}
  // On a phone the bar readout lives in the chart's corner, TradingView style,
  // instead of a line in the sticky header; the hovered bar when there is one.
  if(w<600){
    let b=last,when='';
    if(S.hover&&S.hover.in){const bi=Math.round(G.ix(S.hover.mx));if(bi>=0&&bi<B.length){b=B[bi];
      when=(tfMin()==='D'?dayLbl(b.day):(b.day===HISTN?'':dayLbl(b.day)+' ')+tlblAbs(b.t,!!b.x))+'  ';}}
    if(b){cx.save();cx.font=cfont(F-1,600);cx.textBaseline='top';cx.fillStyle='rgba(11,16,23,.75)';
      const t=when+'O '+b.o.toFixed(2)+'  H '+b.h.toFixed(2)+'  L '+b.l.toFixed(2)+'  C '+b.c.toFixed(2)+'  V '+(b.v/1000).toFixed(0)+'k';
      const tw=cx.measureText(t).width;cx.fillRect(padL+2,padT,tw+10,F+6);
      cx.fillStyle=b.c>=b.o?'#2dd4a7':'#f4525f';cx.fillText(t,padL+7,padT+3);cx.restore();}
  }
  $('fit').classList.toggle('show',!!S.yMan||S.view.right!=null);
}
function shape(d,prev){
  const a=cx.globalAlpha;if(prev)cx.globalAlpha=.7;
  const x1=G.x(barIdxForMin(d.m1)),y1=G.y(d.p1);
  const x2=d.m2!=null?G.x(barIdxForMin(d.m2)):x1,y2=d.p2!=null?G.y(d.p2):y1;
  if(d.t==='trend')ln(x1,y1,x2,y2,'#6d9cf5',1.6);
  else if(d.t==='hline'){ln(G.padL,y1,G.w-G.padR,y1,'#88c0d0',1.3);tag(d.p1.toFixed(2),G.padL+2,y1-1,'#88c0d0');}
  else if(d.t==='rect'){cx.save();cx.fillStyle='rgba(109,156,245,.10)';cx.strokeStyle='rgba(109,156,245,.6)';
    const X=Math.min(x1,x2),Y=Math.min(y1,y2),W=Math.abs(x2-x1),H=Math.abs(y2-y1);
    cx.fillRect(X,Y,W,H);cx.strokeRect(X,Y,W,H);cx.restore();}
  else if(d.t==='fib'){const r=d.p2-d.p1;const placed=[];
    [...LV,1.272,1.618].forEach(p=>{const v=d.p1+r*p,Y=G.y(v),ext=p>1;
      ln(Math.min(x1,x2),Y,G.w-G.padR,Y,ext?'rgba(201,162,39,.5)':'rgba(180,143,173,.5)',1,[3,3]);
      if(placed.some(q=>Math.abs(q-Y)<fs()+6))return;placed.push(Y);
      tag((p*100).toFixed(1).replace('.0','')+'% '+v.toFixed(2),Math.min(x1,x2)+2,Y-1,ext?'#c9a227':'#b48ead');});
    ln(x1,y1,x2,y2,'rgba(180,143,173,.4)',1);}
  else if(d.t==='measure'){const df=d.p2-d.p1,pc=df/d.p1*100;
    cx.save();cx.fillStyle=df>=0?'rgba(38,163,122,.13)':'rgba(224,82,74,.13)';
    cx.fillRect(Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1));cx.restore();
    ln(x1,y1,x2,y2,df>=0?'#26a37a':'#e0524a',1.5);
    const nb=Math.abs(Math.round((d.m2-d.m1)/(tfMin()==='D'?MPD:tfMin())));
    tag((df>=0?'+':'')+df.toFixed(2)+'  '+pc.toFixed(2)+'%  '+nb+' bars',
      Math.min(x1,x2)+3,Math.min(y1,y2)-4,df>=0?'#26a37a':'#e0524a');}
  cx.globalAlpha=a;
}

/* ============ TradingView-style axis interaction ============ */
const pts=new Map();let drag=null,pinch=null,lastTapAxis=0;
function pos(e){const r=cv.getBoundingClientRect();return{mx:e.clientX-r.left,my:e.clientY-r.top};}
function inYAxis(mx){return mx>G.w-G.padR;}
function inXAxis(my){return my>G.padT+G.ph+G.volH+(G.rsiH||0)+2;}
function lockY(){if(!S.yMan)S.yMan={lo:G.lo,hi:G.hi};}
function minAt(x){const bi=Math.round(G.ix(x)),B=G.B;
  const b=B[Math.max(0,Math.min(B.length-1,bi))];return b?b.s:revealed()-1;}
function snap(y,x){if(!S.ind.magnet)return G.yp(y);
  const bi=Math.round(G.ix(x)),B=G.B;if(bi<0||bi>=B.length)return G.yp(y);
  const b=B[bi];let best=G.yp(y),bd=11;
  [b.o,b.h,b.l,b.c].forEach(v=>{const d=Math.abs(G.y(v)-y);if(d<bd){bd=d;best=v;}});return best;}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,pos(e));
  const{mx,my}=pos(e);
  if(pts.size===2){const[a,b]=[...pts.values()];
    pinch={dx:Math.max(1,Math.abs(a.mx-b.mx)),dy:Math.max(1,Math.abs(a.my-b.my)),
      count:S.view.count,lo:G.lo,hi:G.hi};S.pend=null;return;}
  if(inYAxis(mx)){
    const now=Date.now();
    if(now-lastTapAxis<300){S.yMan=null;lastTapAxis=0;draw();return;}
    lastTapAxis=now;
    lockY();drag={mode:'yaxis',my,lo:S.yMan.lo,hi:S.yMan.hi};return;
  }
  if(inXAxis(my)){drag={mode:'xaxis',mx,count:S.view.count};return;}
  if(S.tool==='cursor'){drag={mode:'pan',mx,my,right:G.right,lo:G.lo,hi:G.hi};S.hover={mx,my,in:1};draw();return;}
  if(S.tool==='erase'){erase(mx,my);draw();return;}
  const m=minAt(mx),p=snap(my,mx);
  if(S.tool==='hline'){S.draw.push({t:'hline',m1:m,p1:p});draw();return;}
  S.pend={t:S.tool,m1:m,p1:p,m2:m,p2:p};
});
cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,pos(e));
  if(pinch&&pts.size===2){
    const[a,b]=[...pts.values()];
    const dx=Math.max(1,Math.abs(a.mx-b.mx)),dy=Math.max(1,Math.abs(a.my-b.my));
    S.view.count=Math.max(12,Math.min(400,Math.round(pinch.count*pinch.dx/dx)));
    if(Math.abs(dy/pinch.dy-1)>.06){
      lockY();const mid=(pinch.lo+pinch.hi)/2,r=(pinch.hi-pinch.lo)*pinch.dy/dy;
      S.yMan={lo:mid-r/2,hi:mid+r/2};}
    draw();return;
  }
  const{mx,my}=pos(e);
  S.hover={mx,my,in:mx>G.padL&&mx<G.w-G.padR&&my>G.padT&&my<G.padT+G.ph};
  if(!drag&&!pinch)cv.style.cursor=inYAxis(mx)?'ns-resize':inXAxis(my)?'ew-resize':S.tool==='cursor'?'crosshair':'default';
  if(drag){
    if(drag.mode==='yaxis'){
      const f=Math.exp((my-drag.my)*.014);
      const mid=(drag.lo+drag.hi)/2,r=(drag.hi-drag.lo)*f;
      S.yMan={lo:mid-r/2,hi:mid+r/2};
    }else if(drag.mode==='xaxis'){
      const f=Math.exp((drag.mx-mx)*.012);
      S.view.count=Math.max(12,Math.min(400,Math.round(drag.count*f)));
    }else{
      const B=bars();
      const dxb=Math.round((drag.mx-mx)/G.cw);
      S.view.right=Math.max(G.count-1,Math.min(B.length-1,drag.right+dxb));
      if(S.view.right>=B.length-1)S.view.right=null;
      if(S.yMan){const dp=(my-drag.my)/G.ph*(drag.hi-drag.lo);
        S.yMan={lo:drag.lo+dp,hi:drag.hi+dp};}
    }
  }else if(S.pend){S.pend.m2=minAt(mx);S.pend.p2=snap(my,mx);}
  draw();if(S.hover.in)hoverInfo();
});
function endPtr(e){
  pts.delete(e.pointerId);if(pts.size<2)pinch=null;drag=null;
  if(S.pend){const d=S.pend;S.pend=null;
    if(Math.abs(G.x(barIdxForMin(d.m2))-G.x(barIdxForMin(d.m1)))>5||Math.abs(G.y(d.p2)-G.y(d.p1))>5)S.draw.push(d);}
  draw();
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{S.hover=null;draw();headline();});
cv.addEventListener('wheel',e=>{e.preventDefault();
  const{mx}=pos(e);
  if(inYAxis(mx)){lockY();const mid=(G.lo+G.hi)/2,r=(G.hi-G.lo)*(e.deltaY>0?1.16:.86);
    S.yMan={lo:mid-r/2,hi:mid+r/2};}
  else S.view.count=Math.max(12,Math.min(400,Math.round(S.view.count*(e.deltaY>0?1.12:.89))));
  draw();},{passive:false});
$('fit').onclick=()=>{S.yMan=null;S.view.right=null;draw();};

function erase(mx,my){let bi=-1,bd=12;
  S.draw.forEach((d,k)=>{const x1=G.x(barIdxForMin(d.m1)),y1=G.y(d.p1);let dist;
    if(d.t==='hline')dist=Math.abs(my-y1);
    else{const x2=G.x(barIdxForMin(d.m2)),y2=G.y(d.p2);dist=seg(mx,my,x1,y1,x2,y2);}
    if(dist<bd){bd=dist;bi=k;}});
  if(bi>=0)S.draw.splice(bi,1);}
function seg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;
  let t=L?((px-x1)*dx+(py-y1)*dy)/L:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}

/**
 * What you hold and how it is doing, in the header, so it stays in view while

  else{const q=quote(p.strike,p.optType,p.exDays,u);op=(q.bid-p.avgPrem)*100*p.qty;pp=(q.bid/p.avgPrem-1)*100;dp=1;
