name: Build and deploy site

# Runs the tool on GitHub's machines and publishes the result to GitHub Pages.
#
# Note this makes the report public: anyone with the Pages URL can see the
# watchlist and everything measured from it. Keep the workflow disabled, or the
# repository private with Pages restricted, if that is not what you want.

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # GitHub starts scheduled runs late on this repo: in its first week the
    # 8:20am and 9:25am ET runs began between 12:31pm and 2:17pm, every day.
    # A morning cron cannot be relied on to land before the open.
    #
    # So the build that matters runs in the evening, after the close. Even
    # five hours late it finishes long before the next open, and the levels,
    # fibs, patterns and grades all come from the completed session. Times are
    # UTC, chosen to stay after the 4pm close in both daylight and standard time:
    #   22:37 UTC Mon-Fri  = 6:37pm EDT / 5:37pm EST
    #   01:07 UTC Tue-Sat  = 9:07pm EDT / 8:07pm EST, the same ET evening
    - cron: "37 22 * * 1-5"
    - cron: "7 1 * * 2-6"
    # Morning runs still try to add the premarket. The early ones are there
    # because a start several hours late can still finish before 9:30; the
    # report labels which kind of build you are looking at.
    - cron: "7 8 * * 1-5"
    - cron: "37 9 * * 1-5"
    - cron: "20 12 * * 1-5"
    - cron: "25 13 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a run in progress finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the TypeScript directly, which is why there is no
          # build step and no dependencies to install.
          node-version: "24"

      - name: Build the report
        # --no-replay: the recorded sessions come from the repo. Harvesting on
        # a runner would fetch data that is thrown away when the job ends.
        run: node run.ts --no-replay

      - name: Assemble the site
        run: node publish-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
